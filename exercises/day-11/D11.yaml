# Day 11 exercises (15 retail + 15 finance): computer vision. Values are computed from the data.
retail:
  - {id: R11-1, lesson: L11.1, tier: Basic, title: "Inspect the photos", framing: "Operations wants to know what the cameras see.", deliverable: "Show one photo per store with labelled gaps; report image shape and number of labelled gaps.", expected: "{{ a.v_n_images }} photos of {{ a.v_shape }}; {{ a.v_n_gaps }} labelled gaps.", tolerance: "exact", model: "Every photo is 27,648 numbers; labels are left/right pixel positions of gaps.", wrong: "Modelling before looking at the images.", leader: "Which camera would you check first?"}
  - {id: R11-2, lesson: L11.1, tier: Applied, title: "Camera quality check", framing: "Are all cameras healthy?", deliverable: "Brightness and sharpness per store and week; flag outliers.", expected: "S07 brightness {{ a.v_bright_s7_before }} → {{ a.v_bright_s7_after }} from week 5; S03 sharpness {{ a.v_sharpness_by_store.S03 }} vs ~{{ a.v_sharpness_by_store.S01 }}.", tolerance: "± 0.02", model: "One dim and one blurry camera (V1, V2).", wrong: "Averaging across stores and missing both.", leader: "Who fixes cameras, and how fast?"}
  - {id: R11-3, lesson: L11.1, tier: Stretch, title: "Filters by hand", framing: "Understand what a CNN learns.", deliverable: "Apply blur and vertical-edge filters with NumPy; explain the output.", expected: "Edge filter lights up pack sides and label borders; blur removes sensor noise.", tolerance: "—", model: "Filters are weighted sums over 3 × 3 neighbourhoods.", wrong: "Treating filters as magic.", leader: "Why do learned filters beat hand-made ones?"}
  - {id: R11-4, lesson: L11.2, tier: Basic, title: "Four models", framing: "Pick a gap classifier.", deliverable: "Rule, hand features, pixel logistic, MLP: accuracy, recall, precision on new stores.", expected: "{% for k, v in a.v_cls.items() %}{{ k }}: recall {{ v.rec_test }}%, precision {{ v.prec_test }}%; {% endfor %}", tolerance: "± 2 pp", model: "Report recall and precision — accuracy hides rare gaps.", wrong: "Choosing by accuracy.", leader: "Which metric goes on the store dashboard?"}
  - {id: R11-5, lesson: L11.2, tier: Applied, title: "Worst camera test", framing: "Will it work in every store?", deliverable: "Gap recall on S07 weeks 5–8 and on S03 for each model.", expected: "MLP dim recall {{ a.v_cls['Small neural network on raw pixels'].rec_dim }}% (accuracy still {{ a.v_cls['Small neural network on raw pixels'].acc_dim }}%); pixel logistic blur recall {{ a.v_cls['Logistic regression on raw pixels'].rec_blur }}%.", tolerance: "± 5 pp", model: "Each model fails on a different condition.", wrong: "Reporting only the average.", leader: "Roll out or not?"}
  - {id: R11-6, lesson: L11.2, tier: Stretch, title: "Augmentation", framing: "Make the network robust to light.", deliverable: "Retrain the MLP with random brightness 50–110%; compare.", expected: "Dim recall {{ a.v_cls['Small neural network on raw pixels'].rec_dim }}% → {{ a.v_aug.rec_dim }}%; blur {{ a.v_aug.rec_blur }}%; new stores unchanged.", tolerance: "± 5 pp", model: "Augment for what shouldn't matter.", wrong: "Collecting more bright images only.", leader: "What other conditions would you augment for?"}
  - {id: R11-7, lesson: L11.3, tier: Basic, title: "IoU by hand", framing: "Was this alert right?", deliverable: "Truth gap 80–104, prediction 90–118: compute IoU; hit at 0.5?", expected: "Overlap 14, union 38, IoU 0.37 → miss and false alarm.", tolerance: "± 0.01", model: "IoU = overlap ÷ union.", wrong: "Dividing overlap by the true box only.", leader: "Which IoU standard suits store staff?"}
  - {id: R11-8, lesson: L11.3, tier: Applied, title: "Detection quality", framing: "How good are the gap alerts?", deliverable: "Precision, recall, AP@0.5 and AP@0.75 on new stores.", expected: "Precision {{ a.v_det['test stores'].precision }}%, recall {{ a.v_det['test stores'].recall }}%, AP50 {{ a.v_det['test stores'].ap50 }}, AP75 {{ a.v_det['test stores'].ap75 }}.", tolerance: "± 3 pp", model: "Finds most gaps; edges are coarse.", wrong: "Quoting AP without the IoU level.", leader: "Is it good enough to replace walks?"}
  - {id: R11-9, lesson: L11.3, tier: Applied, title: "On-shelf availability", framing: "The KPI for the COO.", deliverable: "Predicted vs labelled OSA on new stores.", expected: "{{ a.v_det['test stores'].osa_pred }}% vs {{ a.v_det['test stores'].osa_true }}%.", tolerance: "± 1 pp", model: "Known downward bias; calibrate with audits.", wrong: "Reporting camera OSA as exact.", leader: "How big should the monthly audit sample be?"}
  - {id: R11-10, lesson: L11.3, tier: Stretch, title: "Augmentation in detection", framing: "Dim store gap list.", deliverable: "Detection recall on S07 weeks 5–8 with and without augmentation.", expected: "{{ a.v_det_dim_noaug.recall }}% → {{ a.v_det['S07 dim weeks'].recall }}%.", tolerance: "± 5 pp", model: "Robustness carries through to the KPI.", wrong: "Testing only on clean stores.", leader: "What would have happened to S07's reported OSA?"}
  - {id: R11-11, lesson: L11.4, tier: Basic, title: "Price-label reading (design)", framing: "Read shelf price labels.", deliverable: "Design: detect label → read digits → check against price file.", expected: "Detection + OCR + rule check (price must exist in the price file); route low-confidence reads to staff.", tolerance: "—", model: "Cross-check with business data.", wrong: "Trusting raw OCR.", leader: "What error rate is acceptable for price compliance?"}
  - {id: R11-12, lesson: L11.5, tier: Basic, title: "Labeller agreement", framing: "Can we trust the labels?", deliverable: "Agreement and Cohen's kappa between annotators A and B.", expected: "Agreement {{ a.v_agree_pct }}%, chance {{ a.v_kappa_expected_chance }}%, kappa {{ a.v_kappa }}.", tolerance: "± 0.02", model: "Moderate — retrain annotator B (V3).", wrong: "Reporting raw agreement only.", leader: "What kappa do you require?"}
  - {id: R11-13, lesson: L11.5, tier: Applied, title: "Noisy labels", framing: "Does 8% label noise hurt?", deliverable: "Train on randomly flipped labels; test on clean.", expected: "{{ a.v_noisy_train_test_acc }}% — random noise averages out; systematic noise would not.", tolerance: "± 1 pp", model: "Random vs systematic errors.", wrong: "Assuming any noise is fatal or harmless.", leader: "How do you detect systematic labelling errors?"}
  - {id: R11-14, lesson: L11.5, tier: Applied, title: "Alert threshold in money", framing: "Missed gap 12, false alarm 2.", deliverable: "Choose the threshold that minimises expected cost.", expected: "Threshold below 0.5 if misses are 6× costlier — accept more false alarms.", tolerance: "—", model: "Cost-based threshold (L6.6).", wrong: "Default 0.5.", leader: "Who sets the cost assumptions?"}
  - {id: R11-15, lesson: L11.5, tier: Stretch, title: "Privacy design", framing: "Cameras in 400 stores.", deliverable: "Privacy controls checklist.", expected: "Shelf-facing cameras, automatic face blurring, short retention, access logs, signage, legal review, no face recognition.", tolerance: "—", model: "Privacy by design.", wrong: "Collecting everything 'in case'.", leader: "Who signs off?"}
finance:
  - {id: F11-1, lesson: L11.1, tier: Basic, title: "Digits as data", framing: "What does the OCR model see?", deliverable: "Show 10 digit images and their 8 × 8 pixel values.", expected: "{{ a.v_digits_n | n }} images, {{ a.v_digits_pixels }} pixels each, values 0–16.", tolerance: "exact", model: "Each digit is a tiny grid of numbers.", wrong: "Assuming high resolution is needed.", leader: "What resolution do our scanners produce?"}
  - {id: F11-2, lesson: L11.1, tier: Applied, title: "Scanner quality", framing: "Is any scanner degrading?", deliverable: "Design daily brightness, contrast and sharpness checks per scanner.", expected: "Per-scanner statistics with PSI bands; alert on drift.", tolerance: "—", model: "Monitor inputs, not only accuracy.", wrong: "Waiting for complaints.", leader: "Who owns scanners?"}
  - {id: F11-3, lesson: L11.2, tier: Basic, title: "Document type classifier (design)", framing: "Sort cheques, IDs and bills.", deliverable: "Frame as classification; data and metric.", expected: "Labelled images per type, split by branch/date, report recall per class; transfer learning from a pretrained CNN.", tolerance: "—", model: "One label per image.", wrong: "Random split across duplicate scans.", leader: "Which misclassification is most costly?"}
  - {id: F11-4, lesson: L11.2, tier: Applied, title: "Transfer learning plan", framing: "Few labelled IDs.", deliverable: "Explain fine-tuning a pretrained model.", expected: "Reuse early filters, replace the last layer, fine-tune with augmentation (rotation, blur, brightness).", tolerance: "—", model: "Less data, faster, better.", wrong: "Training a CNN from scratch on 500 images.", leader: "What data agreement covers the pretrained model?"}
  - {id: F11-5, lesson: L11.2, tier: Stretch, title: "Augmentation for scans", framing: "Scans vary by angle and lighting.", deliverable: "List augmentations that keep meaning, and ones that don't.", expected: "OK: small rotation, blur, brightness, noise. Not OK: flipping digits (6↔9), large crops cutting fields.", tolerance: "—", model: "Augment only what doesn't change the label.", wrong: "Horizontal flips on text.", leader: "How would you validate the choice?"}
  - {id: F11-6, lesson: L11.3, tier: Basic, title: "Field detection (design)", framing: "Find amount, date, signature boxes.", deliverable: "Evaluation metric for field detection.", expected: "IoU per field, precision/recall at IoU ≥ 0.5, AP per field type.", tolerance: "—", model: "Same evaluation as gap detection.", wrong: "Counting detections without overlap checks.", leader: "Which field must never be missed?"}
  - {id: F11-7, lesson: L11.3, tier: Applied, title: "IoU standard", framing: "Signature box checks.", deliverable: "Why a stricter IoU may be needed for small fields.", expected: "Small boxes: a few pixels of error change IoU a lot; choose the standard by what the next step needs (reading needs the whole field).", tolerance: "—", model: "Standard depends on use.", wrong: "One IoU for everything.", leader: "Ask the vendor which IoU they report."}
  - {id: F11-8, lesson: L11.4, tier: Basic, title: "OCR bake-off", framing: "Which classifier reads digits best?", deliverable: "Accuracy of logistic, SVM, MLP on test digits.", expected: "{{ a.v_ocr_acc | kv('%') }}; best {{ a.v_ocr_best }}.", tolerance: "± 1 pp", model: "All strong; SVM best here.", wrong: "Testing on training digits.", leader: "Is 98% good enough?"}
  - {id: F11-9, lesson: L11.4, tier: Basic, title: "Field accuracy", framing: "The amount, not the digit.", deliverable: "Field accuracy for 6-digit amounts; compare with digit accuracy⁶.", expected: "Digit {{ a.v_ocr_digit_acc }}%; field {{ a.v_cheque_field_acc }}% (theory {{ a.v_cheque_field_acc_theory }}%).", tolerance: "± 1 pp", model: "Errors multiply across characters.", wrong: "Quoting digit accuracy to the business.", leader: "Which number goes in the business case?"}
  - {id: F11-10, lesson: L11.4, tier: Applied, title: "Confidence routing", framing: "Error tolerance 0.5%.", deliverable: "Automation % and error % by threshold; pick threshold.", expected: "Threshold {{ a.v_route_threshold }} → {{ a.v_route_auto_at_thr }}% automated.", tolerance: "± 3 pp", model: "Automate the confident share; people handle the rest.", wrong: "Automating everything at 92.8% field accuracy.", leader: "Is the staffing saving worth it?"}
  - {id: F11-11, lesson: L11.4, tier: Applied, title: "Smudged scanner", framing: "Accuracy drops in one batch.", deliverable: "Accuracy on noisy images vs clean.", expected: "{{ a.v_ocr_acc[a.v_ocr_best] }}% → {{ a.v_ocr_smudged_acc }}%.", tolerance: "± 1 pp", model: "Image quality drift; monitor and route.", wrong: "Retraining before fixing the scanner.", leader: "What daily sample size detects this?"}
  - {id: F11-12, lesson: L11.4, tier: Stretch, title: "Business-rule cross-checks", framing: "Catch OCR errors cheaply.", deliverable: "List checks for cheque fields.", expected: "Figures vs words, valid date, account exists, amount within customer's usual range, duplicate cheque number.", tolerance: "—", model: "Rules catch errors models miss.", wrong: "Relying on the model alone.", leader: "Which check gives the most protection?"}
  - {id: F11-13, lesson: L11.5, tier: Basic, title: "Label agreement for documents", framing: "Two clerks key the same amounts.", deliverable: "Why use kappa and how to resolve disagreements.", expected: "Kappa corrects for chance; adjudicate with a third reviewer; track per clerk.", tolerance: "—", model: "Label quality caps model quality.", wrong: "Assuming clerks are always right.", leader: "What agreement do you require?"}
  - {id: F11-14, lesson: L11.5, tier: Applied, title: "Fairness of ID checks", framing: "Automated ID verification.", deliverable: "Fairness tests before launch.", expected: "Accuracy and false-rejection rate by document type, age of document, and demographic group; human fallback.", tolerance: "—", model: "Measure by group (L9.5).", wrong: "Overall accuracy only.", leader: "What is the fallback for rejected customers?"}
  - {id: F11-15, lesson: L11.5, tier: Stretch, title: "Risk committee pack", framing: "Approve document automation.", deliverable: "One-page pack: accuracy, routing, monitoring, privacy, fairness, fallback.", expected: "Field accuracy and automation at tolerance; daily audit sample; scanner monitoring; redaction and access controls; group accuracy; human fallback.", tolerance: "—", model: "Pyramid readout (L9.7).", wrong: "A model demo instead of evidence.", leader: "What would make you say no?"}
