# Day 10 exercises (15 retail + 15 finance): transfer, capstone, Navigator sprint, exam preparation.
retail:
  - {id: R10-1, lesson: L10.1, tier: Basic, title: "Map the columns", framing: "SwiftCart orders file.", deliverable: "Column mapping for rcp_profile, rcp_quality, rcp_two_group_test and rcp_regression.", expected: "id = order_id; time = order_ts; group = city_zone / dark_store; target = basket amount, items, rating, delivery minutes; promo flag derived from promo_code_used.", tolerance: "—", model: "Map roles; derive what's missing via config (filters) or ask Claude Code to add a derived column in a prepared copy.", wrong: "Editing recipe code to fit the data.", leader: "Which mapping choice would you challenge?"}
  - {id: R10-2, lesson: L10.1, tier: Basic, title: "Units check", framing: "The brief says amounts are in currency units.", deliverable: "Median basket amount; is it plausible for groceries?", expected: "A median in the thousands for ~5 items is implausible — amounts are in minor units (÷ 100).", tolerance: "—", model: "Units checked against domain sense before any statistic.", wrong: "Reporting average basket of 1,800 'currency units'.", leader: "Who confirms units with the data owner?"}
  - {id: R10-3, lesson: L10.1, tier: Applied, title: "Duplicated load", framing: "Are all orders unique?", deliverable: "Orders per day; any day with roughly double volume and identical content under new ids.", expected: "One day appears twice (same timestamps, baskets, riders; new order_ids) — deduplicate on content, not id.", tolerance: "—", model: "Duplicates hide behind new keys; check content.", wrong: "Checking only order_id uniqueness.", leader: "Which KPIs were overstated?"}
  - {id: R10-4, lesson: L10.1, tier: Applied, title: "Promo and basket size", framing: "Do promo codes grow baskets?", deliverable: "Items per order with vs without a code; effect size and CI.", expected: "Positive difference (~+15–20% items) with a tight CI; association only.", tolerance: "—", model: "Welch on items or regression with zone and hour controls.", wrong: "Calling it causal.", leader: "Design the randomised promo test."}
  - {id: R10-5, lesson: L10.1, tier: Stretch, title: "Delivery and ratings", framing: "Where to fix delivery?", deliverable: "Rating vs delivery minutes (slope); minutes by zone (k-group test); peak hours.", expected: "Ratings fall with minutes beyond ~15; zone Z4 slowest (~6 min); evening slower; Fri/Sat peak.", tolerance: "—", model: "Regression for the slope; Welch ANOVA + Games-Howell for zones; ratings missing for ~45% (check MNAR).", wrong: "Averaging ratings without considering who rates.", leader: "Investment case for Z4?"}
  - {id: R10-6, lesson: L10.2, tier: Basic, title: "Q4 headline numbers", framing: "Did the Q4 plan work?", deliverable: "Revenue, margin rate, promo share, discount cost Nov 4–Dec 31, 2025 vs 2024.", expected: "Revenue {{ a.d10_q4_rev_growth | signed }}%; margin {{ a.d10_q4_margin_rate['2024'] }}% → {{ a.d10_q4_margin_rate['2025'] }}%; promo share {{ a.d10_q4_promo_share['2024'] }}% → {{ a.d10_q4_promo_share['2025'] }}%; discount cost {{ a.d10_q4_disc_growth | signed }}%.", tolerance: "± 0.5 pp", model: "Less discount spend, higher margin rate, revenue up.", wrong: "Stopping here and declaring success.", leader: "What else changed between the two years?"}
  - {id: R10-7, lesson: L10.2, tier: Applied, title: "Mechanic economics", framing: "Which mechanics to keep?", deliverable: "Revenue, discount cost per unit revenue and margin by promo type (2025).", expected: "{% for k, v in a.d10_q4_by_type.items() %}{{ k }} cost {{ v.cost_per_revenue }}/rev, margin {{ v.margin_rate }}%; {% endfor %}", tolerance: "± 0.02", model: "Rank mechanics by margin and cost; combine with uplift evidence.", wrong: "Ranking by revenue only.", leader: "Which mechanic would you test cutting?"}
  - {id: R10-8, lesson: L10.2, tier: Stretch, title: "Attribution", framing: "How much of the growth is the plan?", deliverable: "Explain why YoY can't attribute; assemble causal evidence.", expected: "No control; online share doubled; use R09 DiD (+{{ a.d9_r09_twfe_pct }}%), Snacks ROI {{ a.d8_promo_roi }}, cannibalisation; propose a store-level holdout for 2026.", tolerance: "—", model: "Triangulate and design the test.", wrong: "Attributing all growth to the plan.", leader: "Size the 2026 holdout (rcp_power)."}
  - {id: R10-9, lesson: L10.3, tier: Basic, title: "Sprint: stores", framing: "'Is weekly revenue different across the four regions?'", deliverable: "Node, check, fallback.", expected: "N-TEST-KG; equal variances (Levene) and clustering by store; Welch ANOVA / mixed model.", tolerance: "—", model: "Unit of analysis = store-week; clustered.", wrong: "t-tests for every pair.", leader: "What decision rides on it?"}
  - {id: R10-10, lesson: L10.3, tier: Basic, title: "Sprint: forecast", framing: "'How many units of SKU X next month?'", deliverable: "Node, check, fallback.", expected: "N-FCST-SEASON (or N-FCST-INTERMITTENT if sparse); baseline seasonal naive; MASE backtest.", tolerance: "—", model: "Classify demand first (ADI/CV²).", wrong: "ARIMA on intermittent data.", leader: "Service-level choice?"}
  - {id: R10-11, lesson: L10.3, tier: Applied, title: "Sprint: suspicious", framing: "'Are some stores' returns suspicious?'", deliverable: "Node, check, fallback.", expected: "N-ANOM-MULTI / robust z on return rates; MAD = 0 fallback; alert budget.", tolerance: "—", model: "Rates not counts; review capacity.", wrong: "Flagging biggest stores.", leader: "What happens to a flagged store?"}
  - {id: R10-12, lesson: L10.4, tier: Basic, title: "Exam prep: quality", framing: "Held-out data, same schema.", deliverable: "List the quality checks you'll run first and the configs.", expected: "rcp_quality: duplicates (line_id), negative quantities, price ratio > 50, missingness, reconciliation; rcp_profile.", tolerance: "—", model: "Same configs, new path.", wrong: "Assuming the teaching anomalies repeat exactly.", leader: "What differs in a held-out seed?"}
  - {id: R10-13, lesson: L10.4, tier: Applied, title: "Exam prep: shift and experiment", framing: "Find a store shift and an experiment lift.", deliverable: "Which recipes and settings?", expected: "rcp_changepoint (share_of_total) per store; DiD/growth-ratio for the test category with pre-period.", tolerance: "—", model: "Reuse L7.5 and L9.1 configs, change unit/category.", wrong: "Post-only comparison.", leader: "How would you report uncertainty?"}
  - {id: R10-14, lesson: L10.4, tier: Applied, title: "Exam prep: fabricated store", framing: "Benford on held-out data.", deliverable: "Approach and threshold.", expected: "rcp_benford by store vs peer distribution of MAD; last-digit test; refer, don't accuse.", tolerance: "—", model: "Peer comparison beats absolute thresholds.", wrong: "Flagging any MAD > 0.012 without peers.", leader: "Escalation path?"}
  - {id: R10-15, lesson: L10.4, tier: Stretch, title: "Code review", framing: "'Loyalty members 35% more valuable; summer promo +18%.'", deliverable: "List likely flaws before seeing the notebook.", expected: "Selection bias (R20), bulk buyers and price errors in revenue, no control for promo, post-only comparison, duplicates, multiple testing, no CIs.", tolerance: "—", model: "Checklist from Days 1–9.", wrong: "Approving because numbers look plausible.", leader: "Approve, revise or reject?"}
finance:
  - {id: F10-1, lesson: L10.1, tier: Basic, title: "Transfer reuse review", framing: "A colleague's SwiftCart configs.", deliverable: "Checklist to review reusable configs.", expected: "One path to change; documented column mapping; filters explicit; outputs dated; schema report read; regression baseline saved.", tolerance: "—", model: "Reproducible by someone else next month.", wrong: "Hard-coded values in prompts only.", leader: "Would you sign it off?"}
  - {id: F10-2, lesson: L10.1, tier: Applied, title: "Ratings missingness", framing: "Only some orders are rated.", deliverable: "Test whether rating presence depends on delivery time or cancellation.", expected: "Compare delivery minutes for rated vs unrated; treat ratings as possibly MNAR; report the bias direction.", tolerance: "—", model: "L1.3 missingness logic transfers.", wrong: "Averaging available ratings as 'customer satisfaction'.", leader: "What would you add to the app?"}
  - {id: F10-3, lesson: L10.2, tier: Basic, title: "Default rise", framing: "CRO question.", deliverable: "Default rate 2025Q1 vs 2025Q3; by channel.", expected: "{{ a.d10_def_ref }}% → {{ a.d10_def_late }}%; {% for c, v in a.d10_rate_by_channel.items() %}{{ c }} {{ v['2025Q3'] }}%; {% endfor %}", tolerance: "± 0.2 pp", model: "Partner channel defaults far higher.", wrong: "Calendar-month delinquency only.", leader: "What's the first question to the partner manager?"}
  - {id: F10-4, lesson: L10.2, tier: Applied, title: "Mix vs rate", framing: "How much is mix?", deliverable: "Counterfactual 2025Q3 rate at 2025Q1 mix; split of the rise.", expected: "Counterfactual {{ a.d10_cf_no_partner }}%; mix {{ a.d10_rise_from_mix_pp }}pp ({{ a.d10_share_mix }}%), within-channel {{ a.d10_rise_within_pp }}pp.", tolerance: "± 0.3 pp", model: "Both mix and deterioration — two different fixes.", wrong: "Blaming the partner channel for everything.", leader: "Which fix first?"}
  - {id: F10-5, lesson: L10.2, tier: Applied, title: "Partner quality", framing: "Are partner applicants riskier?", deliverable: "Median bureau scores by channel group.", expected: "{{ a.d10_bureau_med | kv }}.", tolerance: "± 3", model: "Lower bureau scores via partner.", wrong: "Assuming same risk because the score 'covers it'.", leader: "Cut-off or pricing change?"}
  - {id: F10-6, lesson: L10.2, tier: Stretch, title: "Readout", framing: "CRO, one page.", deliverable: "Pyramid readout with decision, three supports, risks, next steps.", expected: "Tighten partner cut-off and recalibrate; mix {{ a.d10_share_mix }}% of rise; calibration {{ a.d9_cal_pred_late }}% vs {{ a.d9_cal_actual_late }}%; collections +{{ a.d9_f16_diff }}pp; fairness check on any cut-off.", tolerance: "—", model: "Answer first, quantified, owners.", wrong: "Method-first narrative.", leader: "What's your ask of the CRO?"}
  - {id: F10-7, lesson: L10.2, tier: Stretch, title: "Fairness of the fix", framing: "Tightening the partner cut-off.", deliverable: "Check approval-rate ratio by group before/after the change.", expected: "Simulate the cut-off; report DI by group and region; document justification.", tolerance: "—", model: "Policy changes need fairness review (L9.5).", wrong: "Assuming a risk-based cut-off is automatically fair.", leader: "Who approves?"}
  - {id: F10-8, lesson: L10.3, tier: Basic, title: "Sprint: approval test", framing: "'Did the new approval rule raise approvals without raising defaults?'", deliverable: "Node, check, fallback.", expected: "N-TEST-2G-PROP if randomised (SRM check); else N-CAUSAL-DID/RDD; guardrail on defaults.", tolerance: "—", model: "Design determines method.", wrong: "Before/after comparison.", leader: "Guardrail threshold?"}
  - {id: F10-9, lesson: L10.3, tier: Basic, title: "Sprint: claims", framing: "'Do young drivers claim more often?'", deliverable: "Node, check, fallback.", expected: "N-TEST-COUNT / N-REG-GLM with exposure offset; over-dispersion → NB.", tolerance: "—", model: "Rates per exposure-year.", wrong: "Comparing raw claim counts.", leader: "Pricing implication?"}
  - {id: F10-10, lesson: L10.3, tier: Applied, title: "Sprint: churn", framing: "'When do customers leave and why?'", deliverable: "Node, check, fallback.", expected: "N-TEST-SURV then Cox; PH check; censoring.", tolerance: "—", model: "Survival, not averages.", wrong: "Mean churn month of churners.", leader: "Retention KPI?"}
  - {id: F10-11, lesson: L10.3, tier: Applied, title: "Sprint: model health", framing: "'Is the application score still fine?'", deliverable: "Node, check, fallback.", expected: "N-MON-PSI + N-MON-CONCEPT + N-METRIC-CALIB; mix; recalibrate/rebuild ladder.", tolerance: "—", model: "Inputs, performance, calibration.", wrong: "PSI only.", leader: "Monitoring cadence?"}
  - {id: F10-12, lesson: L10.4, tier: Basic, title: "Exam prep: rings and structuring", framing: "Held-out finance data.", deliverable: "Which configs, and what will differ?", expected: "finance_fraud_rings / finance_structuring with the new path; ring count/size and structurer count differ by seed.", tolerance: "—", model: "Reuse; report what you find, not what you expect.", wrong: "Writing '3 rings' from memory.", leader: "How do you check a colleague didn't copy teaching answers?"}
  - {id: F10-13, lesson: L10.4, tier: Applied, title: "Exam prep: champion/challenger", framing: "Held-out test.", deliverable: "Steps before quoting the lift.", expected: "SRM, balance (SMD), primary metric with CI, guardrails (complaints, recoveries), decision rule.", tolerance: "—", model: "L4 checklist.", wrong: "Lift only.", leader: "Decision if CI crosses zero?"}
  - {id: F10-14, lesson: L10.4, tier: Applied, title: "Exam prep: Benford branch", framing: "One branch's amounts are suspicious.", deliverable: "Approach.", expected: "rcp_benford by branch, compare MAD with peers, last-digit test, refer to audit.", tolerance: "—", model: "Peer comparison.", wrong: "Testing amounts that don't span orders of magnitude.", leader: "Audit referral content?"}
  - {id: F10-15, lesson: L10.4, tier: Stretch, title: "Code review (finance)", framing: "'New score AUC 0.98 — deploy now.'", deliverable: "Likely flaws and decision.", expected: "Leakage (recovery/collections fields), random split instead of out-of-time, no calibration, reject inference, fairness unchecked → reject until fixed.", tolerance: "—", model: "L6.4 + L9.5 + L9.6 checklist.", wrong: "Deploying on AUC.", leader: "What evidence would make you approve?"}
