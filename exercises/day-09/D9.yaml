# Day 9 exercises (15 retail + 15 finance). Values are computed from the data.
retail:
  - {id: R9-1, lesson: L9.1, tier: Basic, title: "Hair Care DiD", framing: "Did the promotion work?", deliverable: "Naive post-only comparison vs two-way FE DiD on log units, weeks 54–77.", expected: "Naive +{{ a.d9_r09_naive_post }}% (p = {{ a.d9_r09_naive_p }}); DiD +{{ a.d9_r09_twfe_pct }}% (CI {{ a.d9_r09_twfe_ci[0] }} to {{ a.d9_r09_twfe_ci[1] }}).", tolerance: "± 2 pp", model: "DiD removes store size differences; covers the planted +12%.", wrong: "Concluding 'no effect' from the post-only test.", leader: "Roll out chain-wide?"}
  - {id: R9-2, lesson: L9.1, tier: Applied, title: "Parallel trends", framing: "Can we trust the DiD?", deliverable: "Pre-period trend difference and event-study plot.", expected: "Slope difference {{ a.d9_r09_pretrend_slope }}%/week, p = {{ a.d9_r09_pretrend_p }}.", tolerance: "± 0.5", model: "No evidence of diverging pre-trends; weekly gaps noisy around zero.", wrong: "Judging by a single pre-period week.", leader: "What would make you doubt it?"}
  - {id: R9-3, lesson: L9.1, tier: Applied, title: "Placebo test", framing: "Is the method finding effects that aren't there?", deliverable: "Run the same DiD for a category without a promotion (Personal Care).", expected: "Estimate near 0 with CI covering 0.", tolerance: "—", model: "Placebos validate the design.", wrong: "Skipping falsification checks.", leader: "Which placebo would convince the CFO?"}
  - {id: R9-4, lesson: L9.1, tier: Basic, title: "Loyalty selection", framing: "Marketing: members spend 38% more.", deliverable: "Naive and demographics-adjusted gaps; joiners' pre-join spend vs never-members.", expected: "Naive +{{ a.d9_r20_naive }}%; adjusted +{{ a.d9_r20_adj_demo }}%; pre-join gap +{{ a.d9_r20_prejoin_gap }}%.", tolerance: "± 2 pp", model: "Members were bigger spenders before joining — selection.", wrong: "Crediting the programme with the whole gap.", leader: "Reword the marketing claim."}
  - {id: R9-5, lesson: L9.1, tier: Stretch, title: "Within-customer effect", framing: "What does joining actually do?", deliverable: "Two-way FE (customer + week) for joiners vs never-members.", expected: "+{{ a.d9_r20_twfe }}% (CI {{ a.d9_r20_twfe_ci[0] }} to {{ a.d9_r20_twfe_ci[1] }}); {{ a.d9_r20_n_joiners }} joiners.", tolerance: "± 3 pp", model: "Close to the true +5%; wide CI → test with randomised incentives.", wrong: "Matching only on demographics.", leader: "Design a randomised enrolment test."}
  - {id: R9-6, lesson: L9.2, tier: Basic, title: "Time to repeat", framing: "How fast do customers come back?", deliverable: "KM median days from first to second visit (last year), by loyalty.", expected: "Median {{ a.d9_repeat_median_days }} days (members {{ a.d9_repeat_median_member }}, non {{ a.d9_repeat_median_non }}); {{ a.d9_repeat_censored }}% censored.", tolerance: "± 10 days", model: "Censoring handled by KM; members return faster (not necessarily caused).", wrong: "Average gap among those who returned.", leader: "Which win-back timing?"}
  - {id: R9-7, lesson: L9.3, tier: Basic, title: "Vendor neural forecast", framing: "A vendor promises 30% better forecasts.", deliverable: "Specify the backtest you'd require.", expected: "Rolling-origin, same horizon, vs seasonal naive and our model, MASE/WAPE by level (L7.3).", tolerance: "—", model: "Fair comparison on your data.", wrong: "Accepting vendor in-sample metrics.", leader: "What contract terms?"}
  - {id: R9-8, lesson: L9.3, tier: Applied, title: "Shelf images", framing: "Store ops wants on-shelf availability from photos.", deliverable: "Explain why deep learning fits here and what data is needed.", expected: "Images → pretrained vision model fine-tuned on labelled photos; measure precision/recall of gaps.", tolerance: "—", model: "Unstructured data is DL's home turf.", wrong: "Hand-crafting pixel features.", leader: "Pilot scope and success metric?"}
  - {id: R9-9, lesson: L9.3, tier: Applied, title: "Review summarisation", framing: "Use an LLM to summarise product reviews.", deliverable: "Governance checklist.", expected: "No personal data, evaluation sample, human review, cite source reviews (RAG), monitor drift.", tolerance: "—", model: "Grounded, reviewed, logged.", wrong: "Publishing raw LLM summaries.", leader: "Who signs off?"}
  - {id: R9-10, lesson: L9.4, tier: Basic, title: "Warranty tail", framing: "Electronics warranties.", deliverable: "Which tools from insurance apply?", expected: "Frequency (claims per unit-year) × severity; simulate aggregate cost; VaR/ES for reserves.", tolerance: "—", model: "Same frequency–severity logic.", wrong: "Reserving at the average only.", leader: "Reserve at which percentile?"}
  - {id: R9-11, lesson: L9.5, tier: Basic, title: "Personalised pricing", framing: "Pilot: personalised discounts.", deliverable: "Fairness checks before launch.", expected: "Average price paid by neighbourhood and protected-attribute proxies; DI of offers; complaints.", tolerance: "—", model: "Test outcomes by group, not just inputs.", wrong: "'We don't use ethnicity, so it's fair.'", leader: "Red lines?"}
  - {id: R9-12, lesson: L9.6, tier: Basic, title: "Discount drift", framing: "Online discounts collapsed.", deliverable: "Run `retail_drift_discount.yaml`; explain.", expected: "Median {{ a.d9_r19_med_before }} → {{ a.d9_r19_med_after }}; PSI {{ a.d9_r19_psi }}; unit flag.", tolerance: "± 0.1", model: "Logging change from week {{ a.d9_r19_first_week }}.", wrong: "Reporting a discount strategy change.", leader: "Who fixes it and what gets restated?"}
  - {id: R9-13, lesson: L9.6, tier: Applied, title: "After the fix", framing: "Is there real drift too?", deliverable: "PSI after rescaling; online share before/after.", expected: "PSI {{ a.d9_r19_psi_fixed }}; online {{ a.d9_r19_online_before }}% → {{ a.d9_r19_online_after }}%.", tolerance: "± 0.02", model: "Discounts stable; channel mix really changed.", wrong: "Stopping at the bug.", leader: "Impact of the mix shift on margin?"}
  - {id: R9-14, lesson: L9.6, tier: Stretch, title: "Monitoring pack", framing: "Ops wants weekly checks.", deliverable: "Design weekly data-quality and drift checks for the sales feed.", expected: "Row counts, nulls, unit checks (median ratios), PSI on key fields, mix by channel, alerts with owners.", tolerance: "—", model: "Automate rcp_drift on a schedule.", wrong: "Checking only totals.", leader: "Escalation path?"}
  - {id: R9-15, lesson: L9.7, tier: Basic, title: "Promotion readout", framing: "Trading board, 5 minutes.", deliverable: "Pyramid readout: answer + 3 quantified supports.", expected: "Keep Hair Care (+{{ a.d9_r09_twfe_pct }}%); cut deep Snacks discounts (ROI {{ a.d8_promo_roi }}); loyalty effect ~{{ a.d9_r20_twfe }}%.", tolerance: "—", model: "Answer first, numbers with uncertainty.", wrong: "Method-first narrative.", leader: "What decision do you ask for?"}
  - {id: R9-16, lesson: L9.8, tier: Basic, title: "Generated product images", framing: "E-commerce wants diffusion-generated lifestyle images.", deliverable: "List governance checks.", expected: "Label as AI-generated, brand and rights review, no real customer likeness, bias check, human approval.", tolerance: "—", model: "Generation needs labelling and review.", wrong: "Publishing unreviewed outputs.", leader: "Who signs off?"}
  - {id: R9-17, lesson: L9.8, tier: Applied, title: "Review summariser", framing: "Summarise 50,000 product reviews by SKU.", deliverable: "Design: transformer + RAG + evaluation.", expected: "Retrieve each SKU's reviews, summarise with citations, evaluate on a labelled sample, monitor drift.", tolerance: "—", model: "Grounded generation.", wrong: "Asking an LLM about SKUs from memory.", leader: "What error rate is acceptable?"}
finance:
  - {id: F9-1, lesson: L9.1, tier: Basic, title: "Gold standard", framing: "Collections strategy effect.", deliverable: "Quote the randomised F16 estimate.", expected: "+{{ a.d9_f16_diff }}pp (CI {{ a.d9_f16_ci[0] }} to {{ a.d9_f16_ci[1] }}).", tolerance: "± 0.5 pp", model: "Randomisation removes confounding.", wrong: "Comparing collectors' historical results.", leader: "Roll out?"}
  - {id: F9-2, lesson: L9.1, tier: Applied, title: "Limit increase RDD", framing: "Limit increases are given above a score of 650.", deliverable: "Design a regression discontinuity.", expected: "Compare spend/default just above vs below 650 (bandwidth), check no manipulation of scores and covariate balance at the cut-off.", tolerance: "—", model: "Local effect at the threshold.", wrong: "Comparing all increased vs not increased.", leader: "What does the effect at 650 tell you about 600?"}
  - {id: F9-3, lesson: L9.1, tier: Stretch, title: "Uplift targeting", framing: "Retention offers.", deliverable: "Describe a T-learner uplift model and evaluation.", expected: "Randomised offer; separate models for treated/control; target highest predicted difference; evaluate with Qini/uplift curves.", tolerance: "—", model: "Target persuadables, not sure things.", wrong: "Targeting highest churn risk.", leader: "Holdout size?"}
  - {id: F9-4, lesson: L9.2, tier: Basic, title: "KM churn", framing: "Retention KPIs.", deliverable: "KM survival at 6/12/24 months; RMST; naive figures.", expected: "{{ a.d9_km_s6 }}%, {{ a.d9_km_s12 }}%, {{ a.d9_km_s24 }}%; RMST {{ a.d9_rmst24 }}; naive mean {{ a.d9_naive_mean_churners }} months.", tolerance: "± 0.5 pp", model: "KM uses censored accounts.", wrong: "Average churn month among churners.", leader: "Which KPI goes on the scorecard?"}
  - {id: F9-5, lesson: L9.2, tier: Applied, title: "Complaints and churn", framing: "Do complaints predict closures?", deliverable: "KM by complaints; log-rank.", expected: "24-month survival {{ a.d9_km_s24_compl_none }}% vs {{ a.d9_km_s24_compl_any }}%; χ² {{ a.d9_logrank_chi2 }}.", tolerance: "± 1 pp", model: "Strong association → service-recovery trigger.", wrong: "Claiming complaints cause churn.", leader: "What intervention?"}
  - {id: F9-6, lesson: L9.2, tier: Applied, title: "Cox drivers", framing: "What drives churn?", deliverable: "Cox HRs and PH check.", expected: "Complaints HR {{ a.d9_cox.complaints_12m.hr }}; digital (per 10 pts) {{ a.d9_cox.digital_share_10pp.hr }}; PH: {{ a.d9_ph_hr_early }} vs {{ a.d9_ph_hr_late }}.", tolerance: "± 0.05", model: "Proportional hazards holds for complaints.", wrong: "Reading HR as a probability.", leader: "Which lever is actionable?"}
  - {id: F9-7, lesson: L9.3, tier: Basic, title: "Bake-off", framing: "Would deep learning help default prediction?", deliverable: "AUC: logistic, GBM, MLP; and with 1,500 rows.", expected: "{{ a.d9_dl_auc | kv }}; small: {{ a.d9_dl_small_auc | kv }}.", tolerance: "± 0.02", model: "Simple model wins on tabular data; MLP worst with little data.", wrong: "Choosing the most complex model.", leader: "Is any gain worth the explanation burden?"}
  - {id: F9-8, lesson: L9.3, tier: Applied, title: "Complaint triage", framing: "LLM to classify complaints.", deliverable: "Evaluation plan.", expected: "Labelled sample, precision/recall per class vs human, redaction, monitoring, human-in-the-loop for regulated categories.", tolerance: "—", model: "Measure before deploying.", wrong: "Trusting demo examples.", leader: "Regulatory categories handled how?"}
  - {id: F9-9, lesson: L9.4, tier: Basic, title: "Frequency model", framing: "Price the motor/home book.", deliverable: "Poisson vs NB with exposure offset.", expected: "AIC {{ a.d9_ins_aic_pois }} vs {{ a.d9_ins_aic_nb }}; α {{ a.d9_ins_nb_alpha }}; frequency {{ a.d9_ins_freq }}.", tolerance: "± 1%", model: "NB preferred.", wrong: "Ignoring exposure.", leader: "Impact on pricing?"}
  - {id: F9-10, lesson: L9.4, tier: Applied, title: "Large losses", framing: "Three huge claims.", deliverable: "Top-3 share; loss ratio with/without; loading.", expected: "{{ a.d9_ins_top3_share }}%; LR {{ a.d9_ins_loss_ratio }} vs {{ a.d9_ins_loss_ratio_excat }}; loading {{ a.d9_ins_cat_loading_pct }}%.", tolerance: "± 1 pp", model: "Price attritional + loading or reinsure.", wrong: "Deleting catastrophic claims.", leader: "Reinsure or retain?"}
  - {id: F9-11, lesson: L9.4, tier: Applied, title: "Aggregate VaR/ES", framing: "Capital for the insurance book.", deliverable: "Monte Carlo EL, VaR99.5, ES99.5 vs premium.", expected: "EL {{ a.d9_ins_el }}M; VaR {{ a.d9_ins_var995 }}M; ES {{ a.d9_ins_es995 }}M; premium {{ a.d9_ins_premium }}M.", tolerance: "± 5%", model: "Premium below expected loss; capital ≈ {{ a.d9_ins_capital }}M.", wrong: "Normal approximation of a skewed loss.", leader: "Risk appetite statement?"}
  - {id: F9-12, lesson: L9.4, tier: Stretch, title: "Credit stress", framing: "Loan book downturn.", deliverable: "Vasicek EL, VaR99.9, ES; stress PD × 2.5.", expected: "EL {{ a.d9_cr_el }}M, VaR {{ a.d9_cr_var999 }}M, ES {{ a.d9_cr_es999 }}M; stress EL {{ a.d9_cr_stress_el }}M, VaR {{ a.d9_cr_stress_var999 }}M.", tolerance: "± 5%", model: "Correlation fattens the tail; capital ≫ EL.", wrong: "Summing independent defaults.", leader: "Which assumption matters most (ρ, PD, LGD)?"}
  - {id: F9-13, lesson: L9.5, tier: Basic, title: "Disparate impact", framing: "Fair-lending review.", deliverable: "Approval rates, DI, inside/outside R4.", expected: "A {{ a.d9_appr_A }}%, B {{ a.d9_appr_B }}%, DI {{ a.d9_di }}; outside R4 ratio {{ a.d9_di_nonR4 }}.", tolerance: "± 0.01", model: "Region R4 is the proxy.", wrong: "'We don't use the attribute.'", leader: "Next steps with legal?"}
  - {id: F9-14, lesson: L9.5, tier: Applied, title: "Error parity and conformal", framing: "Model fairness and uncertainty.", deliverable: "TPR/FPR by group; marginal vs Mondrian conformal coverage of defaulters.", expected: "FPR A {{ a.d9_fair.A.fpr }}% vs B {{ a.d9_fair.B.fpr }}%; defaulters covered {{ a.d9_conf_cov_def }}% (marginal) vs {{ a.d9_confm_cov_def }}% (Mondrian).", tolerance: "± 2 pp", model: "Uneven false positives; marginal coverage hides class failure.", wrong: "Reporting only overall coverage.", leader: "Which criterion do we commit to?"}
  - {id: F9-15, lesson: L9.6, tier: Basic, title: "Drift report", framing: "Monthly model monitoring.", deliverable: "Run `finance_drift_vintage.yaml`; calibration of early model on late vintages; recommendation.", expected: "Score PSI {{ a.d9_f11_psi }}; AUC {{ a.d9_f12_auc_early }} → {{ a.d9_f12_auc_late }}; predicted {{ a.d9_cal_pred_late }}% vs actual {{ a.d9_cal_actual_late }}%; util slope {{ a.d9_f12_util_slope.early }} → {{ a.d9_f12_util_slope.late }}.", tolerance: "± 0.01", model: "Population and concept drift → recalibrate now, rebuild with partner data.", wrong: "Monitoring inputs only.", leader: "Interim policy for partner applications?"}
  - {id: F9-16, lesson: L9.8, tier: Basic, title: "One neuron by hand", framing: "Explain a neuron to the CRO.", deliverable: "Compute z and σ(z) for utilisation 0.9, bureau 620.", expected: "z = {{ a.d9n_neuron.z }}, PD = {{ a.d9n_neuron.p }}%.", tolerance: "± 0.5 pp", model: "A neuron is a logistic regression.", wrong: "Forgetting the bias.", leader: "Why does a network need many neurons?"}
  - {id: F9-17, lesson: L9.8, tier: Applied, title: "Read the training curve", framing: "A vendor shows only training loss.", deliverable: "Compare training and validation loss with weak vs strong L2.", expected: "Weak: best validation epoch {{ a.d9n_weak_best_epoch }}, ends {{ a.d9n_weak_val_end }}; strong: ends {{ a.d9n_strong_val_end }}.", tolerance: "± 0.01", model: "Overfitting after early epochs without a penalty.", wrong: "Trusting falling training loss.", leader: "What do you ask the vendor for?"}
