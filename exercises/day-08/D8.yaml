# Day 8 exercises (15 retail + 15 finance). Values are computed from the data.
retail:
  - {id: R8-1, lesson: L8.1, tier: Basic, title: "Customer segments", framing: "Marketing wants customer segments.", deliverable: "Run `retail_cluster_customers.yaml`; silhouette by k; k = 5 profiles.", expected: "Silhouette {{ a.d8_sil | kv }}; weak structure; promo-hunter segment with ~64% promo share.", tolerance: "± 0.02", model: "Weak overall structure, one clearly actionable segment.", wrong: "Choosing k by the highest silhouette alone and naming personas without sizes.", leader: "Which segment would you act on first?"}
  - {id: R8-2, lesson: L8.1, tier: Applied, title: "Scaling matters", framing: "A junior clustered unscaled features.", deliverable: "ARI between scaled and unscaled k = 5 solutions.", expected: "ARI {{ a.d8_ari_unscaled }}.", tolerance: "± 0.05", model: "Unscaled, revenue dominates distances; scale first.", wrong: "Clustering raw revenue with shares.", leader: "What review step would catch this?"}
  - {id: R8-3, lesson: L8.1, tier: Stretch, title: "Recovering planted segments", framing: "How well does K-Means find the true segments?", deliverable: "ARI vs planted segments; PCA variance of 2 components; components for 80%.", expected: "ARI {{ a.d8_ari }}; PCA2 {{ a.d8_pca_2 }}%; {{ a.d8_pca_n_for_80 }} components for 80%.", tolerance: "± 0.05", model: "Segments overlap in behaviour; clustering recovers them only partly.", wrong: "Treating cluster labels as ground truth.", leader: "How stable must segments be before CRM uses them?"}
  - {id: R8-4, lesson: L8.2, tier: Basic, title: "RFM concentration", framing: "Who matters most?", deliverable: "Share of customers and revenue with RFM 13–15; top-10% revenue share.", expected: "{{ a.d8_rfm_top_share_cust }}% of customers → {{ a.d8_rfm_top_share_rev }}% of revenue; top 10% → {{ a.d8_top10_rev_share }}%.", tolerance: "± 1 pp", model: "Revenue is concentrated; protect the best customers.", wrong: "Ignoring bulk buyers (R07) inflating M.", leader: "What retention action for the top RFM group?"}
  - {id: R8-5, lesson: L8.2, tier: Applied, title: "Simple CLV", framing: "Finance wants a customer value.", deliverable: "Retention year 1→2, annual margin per customer, CLV (d = 10%), top-decile CLV; sensitivity ±10 pp retention.", expected: "Retention {{ a.d8_retention_y2 }}%; margin {{ a.d8_ann_margin_per_cust }}; CLV {{ a.d8_clv }}; top decile {{ a.d8_clv_top_decile }}.", tolerance: "± 5%", model: "CLV is very sensitive to retention; report a range.", wrong: "Single-point CLV without assumptions.", leader: "How much would you pay to acquire a customer?"}
  - {id: R8-6, lesson: L8.3, tier: Basic, title: "Top rules", framing: "Category managers ask what sells together.", deliverable: "Run `retail_basket_rules.yaml`; top rules by lift with support ≥ 1%.", expected: "{% for r in a.d8_top_rules %}{{ r.rule }} (lift {{ r.lift }}); {% endfor %}", tolerance: "± 0.05 lift", model: "Pasta–Sauce and Beer–Chips recovered (R21).", wrong: "Ranking by confidence.", leader: "Which rule would you test first, and how?"}
  - {id: R8-7, lesson: L8.3, tier: Applied, title: "Trivial rules", framing: "A deck says '63% of pasta buyers buy fruit'.", deliverable: "Fruit's base rate and the rule's lift.", expected: "Fruit in {{ a.d8_most_common_share }}% of baskets; {% if a.d8_trivial_rule %}{{ a.d8_trivial_rule.rule }} lift {{ a.d8_trivial_rule.lift }}{% endif %}.", tolerance: "± 1 pp", model: "High confidence driven by popularity; lift is modest.", wrong: "Acting on confidence.", leader: "Rewrite the slide headline."}
  - {id: R8-8, lesson: L8.4, tier: Basic, title: "Elasticities", framing: "Pricing asks how sensitive Snacks and Dairy are.", deliverable: "Run both elasticity configs; with and without promo controls.", expected: "Snacks {{ a.d8_el_snacks }} (no controls ≈ {{ a.d8_el_snacks_nopromo }}); Dairy {{ a.d8_el_dairy }} (no controls ≈ {{ a.d8_el_dairy_nopromo }}).", tolerance: "± 0.1", model: "Snacks elastic, Dairy inelastic; omitting promo controls overstates sensitivity.", wrong: "Regressing units on price without controls.", leader: "Which category would you test a price rise in?"}
  - {id: R8-9, lesson: L8.4, tier: Applied, title: "Price simulation", framing: "What does +5% do?", deliverable: "Units and margin change for +5% in Snacks and Dairy.", expected: "Snacks units {{ a.d8_p5_units_snacks }}%, margin {{ a.d8_p5_margin_snacks }}%; Dairy units {{ a.d8_p5_units_dairy }}%, margin {{ a.d8_p5_margin_dairy }}%.", tolerance: "± 0.5 pp", model: "Both raise margin on paper; Dairy loses little volume.", wrong: "Ignoring traffic/basket effects of Snacks volume loss.", leader: "What guardrails for a price test?"}
  - {id: R8-10, lesson: L8.4, tier: Stretch, title: "Promo ROI and cannibalisation", framing: "Do Snacks promotions pay?", deliverable: "Uplift vs baseline, average discount, ROI; Brand X 200 ml cannibalisation.", expected: "Uplift +{{ a.d8_promo_uplift_pct }}%; discount {{ a.d8_promo_avg_disc }}%; ROI {{ a.d8_promo_roi }}; cannibalisation {{ a.d8_cannibal_victim_pct }}% ({{ a.d8_cannibal_share }}% of gain).", tolerance: "± 5%", model: "Big volume, ROI below 1 before halo; part of the gain is cannibalised.", wrong: "Reporting gross uplift as profit.", leader: "Which promotions would you cut?"}
  - {id: R8-11, lesson: L8.5, tier: Basic, title: "Returns abuse scan", framing: "Loss prevention asks for suspects.", deliverable: "Run `retail_anomaly_returns.yaml`; explain the MAD fallback; top 12.", expected: "{{ a.d8_zero_return_share }}% of customers never return → MAD = 0; fallback to mean absolute deviation.", tolerance: "—", model: "Robust scaling must handle degenerate distributions.", wrong: "Infinite z-scores for any returner.", leader: "How many can loss prevention review?"}
  - {id: R8-12, lesson: L8.5, tier: Applied, title: "Precision of methods", framing: "Which method finds the planted abusers?", deliverable: "Precision in the top {{ a.d8_r17_n_true }} for robust z, Isolation Forest, return count; the 20% rule.", expected: "Robust z {{ a.d8_prec_robustz }}%, forest {{ a.d8_prec_iso }}%, count {{ a.d8_prec_returns_count }}%; rule recall {{ a.d8_rule20_recall }}%, precision {{ a.d8_rule20_precision }}%.", tolerance: "± 5 pp", model: "A well-chosen rate beats counts and a generic forest.", wrong: "Assuming the most complex method wins.", leader: "What happens to a flagged customer?"}
  - {id: R8-13, lesson: L8.5, tier: Stretch, title: "Alert budget", framing: "Set contamination.", deliverable: "Flag counts at 1/2/5%; method overlap.", expected: "{{ a.d8_flag_at_1pct }}, {{ a.d8_flag_at_2pct }}, {{ a.d8_flag_at_5pct }} customers.", tolerance: "exact", model: "Choose by review capacity; prefer cases flagged by multiple methods.", wrong: "Default contamination without capacity planning.", leader: "Monthly review budget?"}
  - {id: R8-14, lesson: L8.6, tier: Basic, title: "Coupon rings (design)", framing: "Coupons are redeemed by linked accounts.", deliverable: "Design a graph of accounts linked by device/payment card; component size threshold.", expected: "Components ≥ 6 accounts are unusual (households 2–3); review whole components.", tolerance: "—", model: "Same method as F07.", wrong: "Reviewing accounts one at a time.", leader: "What data would you need from the app team?"}
  - {id: R8-15, lesson: L8.7, tier: Basic, title: "Trade-credit scoring (design)", framing: "B2B customers buy on credit.", deliverable: "Which scorecard steps transfer to trade credit?", expected: "Bin variables, WoE/IV, points, Gini/KS, vintage and roll-rate monitoring of invoices.", tolerance: "—", model: "Credit tools generalise to any deferred-payment book.", wrong: "Assuming consumer variables apply directly.", leader: "Who owns trade-credit risk?"}
finance:
  - {id: F8-1, lesson: L8.1, tier: Basic, title: "Behavioural clusters", framing: "Cluster card customers by behaviour.", deliverable: "Use `rcp_cluster` on accounts (utilisation, digital share, transactions, tenure); silhouette and profiles.", expected: "Expect weak-to-moderate structure; profile default rate per cluster.", tolerance: "—", model: "Segments useful if treatment differs (digital vs branch, revolvers vs transactors).", wrong: "Including default as a clustering feature.", leader: "Which treatment would differ by cluster?"}
  - {id: F8-2, lesson: L8.2, tier: Basic, title: "Cohort retention", framing: "Are newer cohorts retained as well?", deliverable: "12-month retention by origination year; censored share.", expected: "{{ a.d8_ret12_by_year | kv('%') }}; censored {{ a.d8_censored_pct }}%.", tolerance: "± 0.5 pp", model: "Early attrition is low; most accounts censored — survival methods needed.", wrong: "Average time to churn over churned accounts only.", leader: "Which retention KPI would you adopt?"}
  - {id: F8-3, lesson: L8.3, tier: Basic, title: "Product-holding affinity", framing: "Cross-sell cards to loan customers?", deliverable: "Describe support/confidence/lift for product holdings and the confounding by life stage.", expected: "Lift > 1 shows co-holding, not that offering one causes the other.", tolerance: "—", model: "Use uplift models (L9.1) to target cross-sell.", wrong: "Targeting all high-lift holders.", leader: "How would you test cross-sell offers?"}
  - {id: F8-4, lesson: L8.4, tier: Basic, title: "Rate sensitivity design", framing: "How sensitive is take-up to rate?", deliverable: "Design a randomised rate test.", expected: "Randomise offered rate within risk bands; measure take-up and later default; size with rcp_power.", tolerance: "—", model: "Historical rates are risk-based — confounded.", wrong: "Regressing take-up on historical rates.", leader: "What guardrails (risk, fairness)?"}
  - {id: F8-5, lesson: L8.6, tier: Basic, title: "Fraud rings", framing: "Find rings.", deliverable: "Run `finance_fraud_rings.yaml`.", expected: "{{ a.d8_rings }} components ≥ 6, sizes {{ a.d8_ring_sizes }}, fraud 60% each vs {{ a.d8_base_fraud_pct }}%.", tolerance: "exact", model: "Large shared-link components are rings.", wrong: "Flagging households of 2–3.", leader: "Review process for a ring?"}
  - {id: F8-6, lesson: L8.6, tier: Applied, title: "Structuring", framing: "AML asks for evidence of structuring.", deliverable: "Run `finance_structuring.yaml`; accounts below 10,000 in 6+ months.", expected: "Ratio {{ a.d8_bunch_ratio }} ({{ a.d8_dep_below | n }} vs {{ a.d8_dep_above | n }}); {{ a.d8_struct_accounts }} accounts.", tolerance: "± 1%", model: "Spike below the threshold; refer accounts to compliance.", wrong: "Contacting customers (tipping off).", leader: "What goes in the referral?"}
  - {id: F8-7, lesson: L8.6, tier: Stretch, title: "Combine signals", framing: "Prioritise fraud reviews.", deliverable: "Propose a combined priority score (model, ring, structuring, velocity).", expected: "Weighted or rule-based; prioritise cases with independent agreeing signals.", tolerance: "—", model: "Independent evidence raises precision.", wrong: "Single-signal queues.", leader: "How would you validate the weights?"}
  - {id: F8-8, lesson: L8.7, tier: Basic, title: "IV table", framing: "Which variables matter?", deliverable: "Run `finance_scorecard.yaml`; IV table.", expected: "{{ a.d8_iv | kv }}.", tolerance: "± 0.01", model: "Bureau very strong (legitimate); channel strong; tenure not useful.", wrong: "Dropping bureau as 'suspicious'.", leader: "Is channel a fair variable?"}
  - {id: F8-9, lesson: L8.7, tier: Applied, title: "Missing income", framing: "Impute missing income?", deliverable: "Bad rate and WoE of the missing bin.", expected: "{{ a.d8_income_missing_bad }}% bad, WoE {{ a.d8_income_missing_woe }}.", tolerance: "± 0.5 pp", model: "Missingness is predictive (F02); keep a bin.", wrong: "Mean imputation.", leader: "Is it fair to penalise missing income?"}
  - {id: F8-10, lesson: L8.7, tier: Applied, title: "Points and performance", framing: "Present the scorecard.", deliverable: "Points for bureau bins; Gini; KS.", expected: "Bureau points {{ a.d8_points_bureau | kv }}; Gini {{ a.d8_sc_gini }}; KS {{ a.d8_sc_ks }}.", tolerance: "± 2 pts", model: "600 at 50:1, PDO 20; within norms.", wrong: "Unscaled coefficients as 'points'.", leader: "Where would you set the cut-off score?"}
  - {id: F8-11, lesson: L8.7, tier: Basic, title: "Vintage curves", framing: "How are recent vintages doing?", deliverable: "Cumulative 90+ DPD at months 3–12 for four vintages.", expected: "{% for v, c in a.d8_vintage_curves.items() %}{{ v }}: {{ c[9] }}% at 9m; {% endfor %}", tolerance: "± 0.2 pp", model: "2025Q2 is ~3–4× earlier vintages at the same age.", wrong: "Calendar-month delinquency only.", leader: "What action on the 2025 vintages?"}
  - {id: F8-12, lesson: L8.7, tier: Applied, title: "Roll rates", framing: "Collections planning.", deliverable: "12-month roll-rate matrix; 30→60, 60→90, cure from 30.", expected: "30→60 {{ a.d8_roll_30_60 }}%; 60→90 {{ a.d8_roll_60_90 }}%; cure {{ a.d8_roll_cure_30 }}%.", tolerance: "± 1 pp", model: "Intervene at 30–59; most roll forward.", wrong: "Averaging buckets.", leader: "Where would extra agents go?"}
  - {id: F8-13, lesson: L8.7, tier: Applied, title: "Expected loss", framing: "Provisioning estimate.", deliverable: "EL per account and portfolio with PD 4%, LGD 60%, EAD 60% of limit.", expected: "EL = PD × LGD × EAD; compute with the average limit.", tolerance: "—", model: "Calibrated PDs required (L6.6).", wrong: "Using uncalibrated scores as PDs.", leader: "How would the 2025 vintages change EL?"}
  - {id: F8-14, lesson: L8.7, tier: Stretch, title: "Reject inference", framing: "Can we lower the cut-off?", deliverable: "Compare declined vs booked bureau scores; booked low-score default.", expected: "Declined median {{ a.d8_dec_bureau_median }} vs {{ a.d8_acc_bureau_median }}; {{ a.d8_dec_below600 }}% vs {{ a.d8_acc_below600 }}% below 600; booked low-score default {{ a.d8_booked_low_default }}%.", tolerance: "± 1 pp", model: "Risk below the cut-off is unobserved; run a controlled test.", wrong: "Extrapolating the booked model.", leader: "Design the below-cut-off test."}
  - {id: F8-15, lesson: L8.7, tier: Stretch, title: "Churn model", framing: "Retention wants a churn model.", deliverable: "Outline features, target window, censoring handling and evaluation.", expected: "Features at observation point; target churn in next 6 months among active; survival or discrete-time models; PR-AUC and lift.", tolerance: "—", model: "Churn = survival problem with censoring (L9.2).", wrong: "Training on churned vs never-churned regardless of observation time.", leader: "What retention action would the model trigger?"}
