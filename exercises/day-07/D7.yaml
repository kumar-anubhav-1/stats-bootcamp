# Day 7 exercises (15 retail + 15 finance). Values are computed from the data.
retail:
  - {id: R7-1, lesson: L7.1, tier: Basic, title: Decompose chain sales, framing: "Planning wants the seasonal pattern of chain units.", deliverable: "STL (period 52) of weekly chain units; seasonal and trend strength; ACF at lags 1 and 52.", expected: "Seasonal strength {{ a.d7_seas_strength }}, trend strength {{ a.d7_trend_strength }}; ACF1 {{ a.d7_acf1 }}, ACF52 {{ a.d7_acf52 }}.", tolerance: "± 0.05", model: "Annual seasonality dominates; same-week-last-year is highly informative.", wrong: "Fitting a trend line through seasonal data.", leader: "How should year-on-year reporting handle holidays?"}
  - {id: R7-2, lesson: L7.1, tier: Applied, title: Calendar effects, framing: "Trading asks how much weekends, Q4 and holidays matter.", deliverable: "Fri–Sat vs Mon–Thu basket ratio; Q4 non-holiday vs other weeks; holiday vs non-holiday weeks.", expected: "×{{ a.d7_frisat_ratio }}, ×{{ a.d7_q4_ratio }}, ×{{ a.d7_hol_ratio }} (planted +30%, +25%, +40%).", tolerance: "± 0.03", model: "Calendar effects are large; comparisons must align them.", wrong: "Comparing a holiday week with a normal week.", leader: "Which KPI comparisons in your packs ignore the calendar?"}
  - {id: R7-3, lesson: L7.2, tier: Basic, title: Baselines first, framing: "Forecast Beverages for weeks 79–104.", deliverable: "Naive, seasonal naive and 8-week moving average: WAPE and bias.", expected: "Naive {{ a.d7_fc.naive.wape }}% (bias {{ a.d7_fc.naive.bias }}%); seasonal naive {{ a.d7_fc.seasonal_naive.wape }}% ({{ a.d7_fc.seasonal_naive.bias }}%); moving average {{ a.d7_fc.moving_avg_8.wape }}%.", tolerance: "± 0.3 pp", model: "Seasonal naive halves the naive error: seasonality is most of the signal.", wrong: "Skipping baselines.", leader: "What improvement over seasonal naive would justify a new model?"}
  - {id: R7-4, lesson: L7.2, tier: Applied, title: Regression with seasonality and drivers, framing: "Add Fourier seasonality, holiday and temperature.", deliverable: "Log-linear regression and SARIMAX(1,0,0) with the same regressors; WAPE, MASE, bias.", expected: "Regression {{ a.d7_fc.regression_fourier.wape }}% (MASE {{ a.d7_fc.regression_fourier.mase }}); SARIMAX {{ a.d7_fc.sarimax.wape }}%.", tolerance: "± 0.3 pp", model: "Known drivers beat pure time-series structure; temperature must be a forecast in production.", wrong: "Using actual temperature in a live forecast.", leader: "Which drivers do you have reliable forecasts for?"}
  - {id: R7-5, lesson: L7.2, tier: Stretch, title: Why damped Holt is biased, framing: "Damped Holt under-forecasts the test period.", deliverable: "Explain its bias and when Holt-Winters would be appropriate.", expected: "Bias {{ a.d7_fc.holt_damped.bias }}%: no seasonal component (Holt-Winters needs two full cycles to fit; only 78 weeks available).", tolerance: "—", model: "Model structure must match the data's patterns and history length.", wrong: "Blaming the parameters.", leader: "How much history do you need for annual seasonality?"}
  - {id: R7-6, lesson: L7.3, tier: Basic, title: Rolling-origin backtest, framing: "Is the regression reliably better?", deliverable: "WAPE of seasonal naive and regression at origins 78, 86, 94 (horizon 8).", expected: "{% for b in a.d7_backtest %}origin {{ b.origin }}: {{ b.snaive_wape }}% vs {{ b.reg_wape }}%; {% endfor %}means {{ a.d7_bt_mean_snaive }}% vs {{ a.d7_bt_mean_reg }}%.", tolerance: "± 0.3 pp", model: "Better on average, not at every origin.", wrong: "Choosing a model from one window.", leader: "How many origins would you require?"}
  - {id: R7-7, lesson: L7.3, tier: Applied, title: Accuracy by level, framing: "Store replenishment wants an accuracy KPI.", deliverable: "Chain WAPE vs store-level WAPE (chain forecast split by historic shares).", expected: "Chain {{ a.d7_wape_chain }}%, store {{ a.d7_wape_store }}%.", tolerance: "± 0.5 pp", model: "Aggregates are smoother; report accuracy at the decision level.", wrong: "Quoting chain accuracy for store decisions.", leader: "Rewrite the KPI definition."}
  - {id: R7-8, lesson: L7.3, tier: Stretch, title: Metric choice, framing: "A dashboard reports MAPE for all SKUs.", deliverable: "Explain why MAPE fails for intermittent SKUs and propose replacements.", expected: "MAPE is undefined/infinite at zero actuals and rewards under-forecasting; use WAPE (portfolio), MASE (per item), bias.", tolerance: "—", model: "Metrics must suit zeros and the asymmetric cost of errors.", wrong: "Dropping zero weeks from the metric.", leader: "Which metric goes in the supply-chain scorecard?"}
  - {id: R7-9, lesson: L7.4, tier: Basic, title: Classify demand, framing: "How much of the range is intermittent?", deliverable: "ADI/CV² classes for all SKUs.", expected: "{{ a.d7_sbc | kv('%') }}; ADI > 1.32 for {{ a.d7_adi_share }}%.", tolerance: "± 1 pp", model: "A quarter of SKUs need intermittent methods.", wrong: "Forecasting every SKU with ETS.", leader: "Which of these SKUs should be delisted?"}
  - {id: R7-10, lesson: L7.4, tier: Applied, title: The zero-forecast trap, framing: "A vendor reports excellent MASE on slow movers.", deliverable: "Mean MASE and total bias of SES, Croston, SBA and zero on intermittent SKUs.", expected: "MASE {{ a.d7_int_mase | kv }}; bias {{ a.d7_int_bias | kv('%') }}.", tolerance: "± 0.02", model: "Zero 'wins' MASE because MAE rewards the median; judge by bias and service level.", wrong: "Buying the vendor's zero forecasts.", leader: "Which acceptance test would you set for the vendor?"}
  - {id: R7-11, lesson: L7.4, tier: Stretch, title: Hierarchy, framing: "Regional planners and the chain plan disagree.", deliverable: "Bottom-up vs top-down WAPE at chain and region level.", expected: "Chain {{ a.d7_h_total_wape_bu }}% vs {{ a.d7_h_total_wape_td }}%; regions {{ a.d7_h_reg_wape_bu }}% vs {{ a.d7_h_reg_wape_td }}%.", tolerance: "± 0.3 pp", model: "Top-down wins at region level here (noisy regions, stable shares); test before choosing; keep forecasts coherent.", wrong: "Each team forecasting independently.", leader: "Who owns the reconciled number?"}
  - {id: R7-12, lesson: L7.5, tier: Basic, title: Store S017 break, framing: "Operations asks when S017's decline started.", deliverable: "Run `retail_changepoint_s017.yaml`: break week, level ratio, CUSUM alarm (h = 8 and h = 5).", expected: "Week {{ a.d7_cp_week }}, ratio {{ a.d7_cp_ratio }}; CUSUM alarm week {{ a.d7_cusum_alarm_week }} (h = 8), week {{ a.d7_cusum_alarm_h5 }} (h = 5, false alarm).", tolerance: "± 1 week", model: "Share-of-total isolates the store-specific shift; the threshold trades speed for false alarms.", wrong: "Looking for the break in raw revenue.", leader: "What would you ask the store manager?"}
  - {id: R7-13, lesson: L7.5, tier: Applied, title: Uncensor demand, framing: "Are stock-outs depressing forecasts?", deliverable: "Total observed vs uncensored demand vs truth.", expected: "Observed {{ a.d7_naive_vs_true_pct }}% vs truth; uncensored {{ a.d7_uncens_vs_true_pct }}%; uplift {{ a.d7_uncensor_uplift_pct }}%.", tolerance: "± 0.5 pp", model: "Sales understate demand by about 3%; simple scaling slightly over-corrects.", wrong: "Training forecasts on raw sales.", leader: "What in-stock data should supply chain provide?"}
  - {id: R7-14, lesson: L7.6, tier: Basic, title: Safety stock for the top SKU, framing: "Set safety stock for SKU {{ a.d7_top_sku }}.", deliverable: "Safety stock at 90–99.5% service, lead time 2 weeks; reorder point at 95%; Poisson comparison.", expected: "SS {{ a.d7_ss | kv }}; ROP {{ a.d7_rop_95 | n }}; Poisson SS(95%) {{ a.d7_ss_poisson_95 }}.", tolerance: "± 2 units", model: "99% needs ~40% more safety stock than 95%; Poisson badly under-states variability.", wrong: "Using σ = √μ.", leader: "Is 99% worth it for this SKU?"}
  - {id: R7-15, lesson: L7.6, tier: Applied, title: ABC/XYZ policy, framing: "Propose differentiated service levels.", deliverable: "Run `retail_inventory_skus.yaml`; propose service levels by segment and estimate saving vs blanket 99%.", expected: "{{ a.d7_ax }} AX items, {{ a.d7_cz }} CZ items; e.g. AX 99%, B 95%, C 90% (CZ order to demand).", tolerance: "—", model: "Segment-based targets cut stock substantially with little service loss on revenue.", wrong: "One target for all SKUs.", leader: "Which segment would you delist first?"}
finance:
  - {id: F7-1, lesson: L7.1, tier: Basic, title: Delinquency series, framing: "Is delinquency stable?", deliverable: "Monthly 30+ DPD rate; first and last value; ADF p-value.", expected: "{{ a.d7_dq_first }}% → {{ a.d7_dq_last }}% over {{ a.d7_dq_months }} months; ADF p {{ a.d7_dq_adf_p }}.", tolerance: "± 0.1 pp", model: "Non-stationary — rising with portfolio seasoning and the partner vintages.", wrong: "Fitting a stationary model.", leader: "What explains the trend?"}
  - {id: F7-2, lesson: L7.1, tier: Applied, title: Seasoning vs calendar, framing: "Separate vintage effects from calendar effects.", deliverable: "Describe a vintage × months-on-book view and why calendar-time series mix them.", expected: "Calendar series mixes accounts at different ages and from different channels; vintage curves compare like with like (Day 8).", tolerance: "—", model: "Delinquency depends on age; a growing young book lowers early rates, seasoning raises them later.", wrong: "Reading calendar trends as economic.", leader: "Which view goes to the risk committee?"}
  - {id: F7-3, lesson: L7.2, tier: Basic, title: Balance forecast, framing: "Forecast total balances for the next six months.", deliverable: "Damped Holt vs naive on a 6-month hold-out.", expected: "Holt WAPE {{ a.d7_bal_wape_holt }}% vs naive {{ a.d7_bal_wape_naive }}% (naive bias {{ a.d7_bal_bias_naive }}%).", tolerance: "± 0.5 pp", model: "A growing book needs trend.", wrong: "Naive for a growing portfolio.", leader: "What would change the trend (policy, channel)?"}
  - {id: F7-4, lesson: L7.2, tier: Applied, title: Drivers known in advance, framing: "Which drivers can feed a balance forecast?", deliverable: "List drivers available at forecast time vs not.", expected: "Available: planned limit changes, marketing plans, rate changes, calendar. Not: future defaults, actual spend.", tolerance: "—", model: "Only use drivers known (or forecast) at forecast time.", wrong: "Using next month's actual payments.", leader: "Who supplies the planned drivers?"}
  - {id: F7-5, lesson: L7.2, tier: Stretch, title: Over-engineered forecast, framing: "A team proposes a deep-learning balance forecast.", deliverable: "Specify the evidence you'd require.", expected: "Rolling backtest vs damped Holt and naive, bias, stability, explainability for finance.", tolerance: "—", model: "Complexity must win consistently.", wrong: "Approving on one chart.", leader: "What's your default answer and why?"}
  - {id: F7-6, lesson: L7.3, tier: Basic, title: Bias first, framing: "Finance cares about bias.", deliverable: "Explain why bias matters more than WAPE for provisioning forecasts.", expected: "Systematic under-forecasting of losses under-provisions; offsetting errors in WAPE matter less.", tolerance: "—", model: "Track bias by month and segment.", wrong: "Reporting only WAPE.", leader: "What bias tolerance would you set?"}
  - {id: F7-7, lesson: L7.3, tier: Applied, title: Backtest design for monthly data, framing: "Only 42 months of history.", deliverable: "Design a rolling-origin backtest (origins, horizon).", expected: "e.g. origins at months 30, 33, 36, 39 with 3-month horizons; accept fewer origins and wider uncertainty.", tolerance: "—", model: "Short histories limit validation; be explicit about it.", wrong: "Random k-fold on months.", leader: "How do you communicate the uncertainty?"}
  - {id: F7-8, lesson: L7.3, tier: Stretch, title: Level matters, framing: "Branch forecasts look poor.", deliverable: "Explain why branch-level accuracy is lower than portfolio accuracy.", expected: "Smaller numbers, more noise; aggregate errors cancel.", tolerance: "—", model: "Set targets at the decision level.", wrong: "Comparing branch WAPE with portfolio WAPE.", leader: "Which level should staffing use?"}
  - {id: F7-9, lesson: L7.4, tier: Basic, title: Intermittent events, framing: "Monthly fraud cases per branch are mostly zero.", deliverable: "Classify and suggest a method.", expected: "Intermittent (ADI > 1.32); SBA or pooled Poisson/NB rate model across branches.", tolerance: "—", model: "Pool information across sparse units.", wrong: "ETS per branch.", leader: "How would you set branch fraud budgets?"}
  - {id: F7-10, lesson: L7.4, tier: Applied, title: Reconciling plans, framing: "Branch plans exceed the regional plan by 8%.", deliverable: "Propose a reconciliation approach.", expected: "Top-down allocation by stable shares, or MinT reconciliation; one agreed number.", tolerance: "—", model: "Coherent forecasts across levels.", wrong: "Letting each level plan independently.", leader: "Who arbitrates?"}
  - {id: F7-11, lesson: L7.5, tier: Basic, title: Delinquency regime shift, framing: "When did delinquency change regime?", deliverable: "Change-point on the monthly 30+ DPD rate.", expected: "Break at {{ a.d7_dq_break_month }}: {{ a.d7_dq_before }}% → {{ a.d7_dq_after }}%.", tolerance: "± 1 month", model: "Aligns with partner vintages seasoning; forecast from the new regime.", wrong: "Averaging across regimes.", leader: "What would you tell the board?"}
  - {id: F7-12, lesson: L7.5, tier: Applied, title: Monitoring threshold, framing: "Set a CUSUM alert on delinquency.", deliverable: "Explain the k and h choices and their trade-off.", expected: "k ≈ half the shift to detect (in SDs); h sets false-alarm rate vs detection delay.", tolerance: "—", model: "Choose by tolerable false alarms per year.", wrong: "Alerting on every monthly rise.", leader: "How many false alarms per year will you accept?"}
  - {id: F7-13, lesson: L7.5, tier: Stretch, title: Censoring in finance, framing: "Credit-limit utilisation is capped at the limit.", deliverable: "Explain how capped utilisation censors 'demand for credit'.", expected: "Customers at the limit would borrow more; observed balances understate demand — affects limit-increase analysis.", tolerance: "—", model: "Same logic as stock-outs.", wrong: "Treating balances at the limit as true demand.", leader: "How would you test limit increases?"}
  - {id: F7-14, lesson: L7.6, tier: Basic, title: Collections capacity, framing: "Size the collections team.", deliverable: "Monthly 30+ DPD entries (last 12 months): mean, SD, 95% capacity.", expected: "Mean {{ a.d7_coll_mean | n }}, SD {{ a.d7_coll_sd | n }}; capacity {{ a.d7_coll_cap95 | n }} cases.", tolerance: "± 5", model: "Same quantile logic as safety stock.", wrong: "Staffing to the mean.", leader: "What service level for collections calls?"}
  - {id: F7-15, lesson: L7.6, tier: Applied, title: Branch cash buffer, framing: "Branch cash must cover withdrawals 99% of days.", deliverable: "Describe the calculation and its data needs.", expected: "Buffer = mean + z₀.₉₉ × SD of daily net withdrawals over the replenishment interval (√L); use empirical quantiles if skewed.", tolerance: "—", model: "Inventory logic applies to cash.", wrong: "Using the average withdrawal.", leader: "What is the cost of idle cash vs a stock-out of cash?"}
