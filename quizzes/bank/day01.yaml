  - id: q3
    type: mcq
    difficulty: 3
    concepts:
    - C054
    prompt: "Utilisation's correlation with default is {{ a.d1_util_def_pearson }}, yet >90% utilisation defaults {{ a.d1_util_def_ratio }}× as often as ≤50%. Why?"
    options:
    - id: a
      text: A rare binary outcome with a threshold-shaped effect keeps r small
      correct: true
      why: Look at binned rates.
    - id: b
      text: The ratio is wrong
      why: Both are correct.
    - id: c
      text: Utilisation is irrelevant
      why: No.
    - id: d
      text: Correlation is always small
      why: No.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C062
    prompt: "Temperature correlates with Hair Care units (r = {{ a.d1_temp_hair_r }}) though no weather effect exists. Most likely cause?"
    options:
    - id: a
      text: Shared drivers — seasonality, holidays, region size
      correct: true
      why: Spurious correlation.
    - id: b
      text: People wash hair more when warm
      why: Not in the data-generating process.
    - id: c
      text: Rounding
      why: No.
    - id: d
      text: Duplicates
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C055
    prompt: A relationship is curved but always increasing, with a few extreme points. Which coefficient?
    options:
    - id: a
      text: Spearman
      correct: true
      why: Rank-based, monotone.
    - id: b
      text: Pearson
      why: Linear; sensitive to extremes.
    - id: c
      text: Covariance
      why: Not standardised.
    - id: d
      text: Cramér's V
      why: Categorical.
  - id: q6
    type: numeric
    difficulty: 2
    concepts:
    - C060
    prompt: Cramér's V between loyalty segment and 'basket contains a promo item' (3 decimals)?
    answer: "{{ a.d1_promo_seg_v }}"
    tolerance_abs: 0.01
    explanation: "Weak association even though p ≈ {{ a.d1_promo_seg_p }}."
  - id: q7
    type: tf_reason
    difficulty: 2
    concepts:
    - C062
    prompt: "True or false: price and quantity correlate at {{ a.d1_pq_pearson }} across products, so price barely affects demand."
    options:
    - id: a
      text: False — product type confounds it; elasticity needs within-product price variation
      correct: true
      why: Expensive items are bought singly, cheap ones in multiples.
    - id: b
      text: 'True'
      why: Cross-product correlation is not elasticity.
    - id: c
      text: True, if p < 0.05
      why: Significance doesn't remove confounding.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C059
    prompt: In a crosstab of loyalty segment × promo basket, which percentage answers 'Do gold members buy more promotions?'
    options:
    - id: a
      text: Row % within each segment (share of each segment's baskets with a promo item)
      correct: true
      why: Compares segments on the outcome.
    - id: b
      text: Column % within promo/non-promo
      why: Answers a different question.
    - id: c
      text: Total %
      why: Mixes segment size and behaviour.
    - id: d
      text: Raw counts
      why: Segments differ in size.
- id: L1.7-L
  title: L1.7 Correlation judgement (Leader)
  lesson: L1.7
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C054
    prompt: "A junior proposes dropping utilisation from the risk model because |r| with default is only {{ a.d1_util_def_pearson }}. Decision?"
    options:
    - id: a
      text: "Reject — binned default rates show a {{ a.d1_util_def_ratio }}× risk gradient; never screen on r alone"
      correct: true
      why: Non-linear, rare-outcome relationships.
    - id: b
      text: Approve — simpler model
      why: Loses a key driver.
    - id: c
      text: Approve if AUC unchanged
      why: Check properly first.
    - id: d
      text: Replace with income
      why: Different information.
  - id: q2
    type: scenario
    difficulty: 3
    concepts:
    - C062
    prompt: "Marketing: 'Warm weeks drive beverage sales (r = {{ a.d1_temp_bev_r }}) — let's buy weather-triggered ads.' Your request?"
    options:
    - id: a
      text: A control category and de-seasonalised analysis (or a test) before spending
      correct: true
      why: "Hair Care shows r = {{ a.d1_temp_hair_r }} without any weather effect."
    - id: b
      text: Approve — r is high
      why: Seasonality confounds.
    - id: c
      text: Ask for a higher r
      why: Not the issue.
    - id: d
      text: Reject weather entirely
      why: There may be a real effect; test it.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C062
    prompt: Write your two-question coaching routine for any correlation a junior presents.
    model: '"Name one confounder that could create this correlation." and "Name the mechanism by which X would change Y." Without a credible mechanism and with an obvious confounder, the correlation is a hypothesis, not a finding.'
    rubric: 'Full: confounder + mechanism + conclusion. Partial: one question.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C054
    prompt: "Income–limit correlation is {{ a.d1_il_pearson }}. Implication for modelling?"
    options:
    - id: a
      text: Expect multicollinearity — choose or combine the variables before modelling
      correct: true
      why: Unstable coefficients otherwise (Day 5).
    - id: b
      text: Use both for extra accuracy
      why: Little gain, unstable coefficients.
    - id: c
      text: Drop both
      why: Loses information.
    - id: d
      text: No implication
      why: There is one.
  - id: q5
    type: scenario
    difficulty: 2
    concepts:
    - C060
    prompt: "A segment difference has p < 0.001 but Cramér's V = {{ a.d1_promo_seg_v }}. How do you report it?"
    options:
    - id: a
      text: As a weak association that is statistically detectable because n is large
      correct: true
      why: Significance ≠ strength.
    - id: b
      text: As a strong effect
      why: V is small.
    - id: c
      text: As no effect
      why: There is a weak one.
    - id: d
      text: Only the p-value
      why: Report strength.
