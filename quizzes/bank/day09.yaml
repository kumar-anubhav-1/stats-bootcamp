quizzes:
- id: L9.1-F
  title: L9.1 Causal methods (Basic → Advanced)
  lesson: L9.1
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 2
    concepts: &id001
    - C269
    prompt: DiD's key assumption is…
    options:
    - id: a
      text: Parallel trends without treatment
      correct: true
      why: Identification.
    - id: b
      text: Random assignment
      why: Not required.
    - id: c
      text: Normal outcomes
      why: No.
    - id: d
      text: Equal group sizes
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C269
    prompt: Two-way FE DiD lift (%) for Hair Care?
    answer: "{{ a.d9_r09_twfe_pct }}"
    tolerance_abs: 2
    unit: '%'
    explanation: Planted +12%.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C269
    prompt: Post-only comparison wasn't significant because…
    options:
    - id: a
      text: Store size differences swamp the effect; DiD compares each store with itself
      correct: true
      why: Variance.
    - id: b
      text: No effect
      why: There was.
    - id: c
      text: Too few weeks
      why: No.
    - id: d
      text: Wrong category
      why: No.
  - id: q4
    type: numeric
    difficulty: 2
    concepts:
    - C268
    prompt: Naive loyalty basket uplift (%)?
    answer: "{{ a.d9_r20_naive }}"
    tolerance_abs: 2
    unit: '%'
    explanation: Selection.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C268
    prompt: "Adjusting for demographics left the loyalty gap at {{ a.d9_r20_adj_demo }}% because…"
    options:
    - id: a
      text: People join because they already spend more — unobserved
      correct: true
      why: Self-selection.
    - id: b
      text: Wrong covariates coded
      why: No.
    - id: c
      text: Programme is very effective
      why: Within-customer ≈ 5%.
    - id: d
      text: Sample too small
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C272
    prompt: Eligibility by a score cut-off suggests…
    options:
    - id: a
      text: Regression discontinuity
      correct: true
      why: Local comparison.
    - id: b
      text: Synthetic control
      why: One unit.
    - id: c
      text: K-Means
      why: No.
    - id: d
      text: Chi-square
      why: No.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: A placebo test runs the DiD where…
    options:
    - id: a
      text: No effect should exist (e.g. a category without the promotion)
      correct: true
      why: Falsification.
    - id: b
      text: The effect is largest
      why: No.
    - id: c
      text: Only treated stores
      why: No.
    - id: d
      text: Random weeks only
      why: Partial.
    concepts: *id001
  - id: t2
    type: numeric
    difficulty: 2
    prompt: Within-customer loyalty effect (%) from two-way fixed effects?
    answer: "{{ a.d9_r20_twfe }}"
    tolerance_abs: 3
    explanation: True +5%.
    concepts: *id001
- id: L9.1-L
  title: L9.1 Causal claims (Leader)
  lesson: L9.1
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts: &id002
    - C268
    prompt: 'Marketing: ''Loyalty makes customers spend 38% more.'' Response?'
    options:
    - id: a
      text: "Ask for pre-join spend or a randomised offer; causal ≈ {{ a.d9_r20_twfe }}%"
      correct: true
      why: Selection.
    - id: b
      text: Accept
      why: Biased.
    - id: c
      text: Cancel programme
      why: Not shown.
    - id: d
      text: Double rewards
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C271
    prompt: Uplift models target…
    options:
    - id: a
      text: Customers whose behaviour changes because of treatment
      correct: true
      why: Persuadables.
    - id: b
      text: Highest-propensity buyers
      why: Sure things.
    - id: c
      text: Random customers
      why: No.
    - id: d
      text: Lowest risk
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C269
    prompt: How would you defend the Hair Care result to a sceptic?
    model: "DiD with store and week effects gives +{{ a.d9_r09_twfe_pct }}% (CI {{ a.d9_r09_twfe_ci[0] }}–{{ a.d9_r09_twfe_ci[1] }}); pre-trends parallel (p = {{ a.d9_r09_pretrend_p }}); a placebo category shows no effect."
    rubric: 'Full: estimate + pre-trend + placebo. Partial: estimate.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C269
    prompt: '''Sales rose since launch'' lacks…'
    options:
    - id: a
      text: A control over the same period
      correct: true
      why: Counterfactual.
    - id: b
      text: Decimals
      why: No.
    - id: c
      text: A chart
      why: Not the issue.
    - id: d
      text: Nothing
      why: No.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: '''Pre-trends look parallel'' — what evidence?'
    options:
    - id: a
      text: Event-study plot and pre-period trend test
      correct: true
      why: Show the pre-period.
    - id: b
      text: A single week
      why: Noisy.
    - id: c
      text: Gut feel
      why: No.
    - id: d
      text: Post-period only
      why: No.
    concepts: *id002
- id: L9.2-F
  title: L9.2 Survival (Basic → Advanced)
  lesson: L9.2
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts: &id003
    - C274
    prompt: A censored account is one that…
    options:
    - id: a
      text: Hadn't churned by the end of observation
      correct: true
      why: Unknown end.
    - id: b
      text: Churned
      why: Event.
    - id: c
      text: Has missing data
      why: No.
    - id: d
      text: Was deleted
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C274
    prompt: KM survival (%) at 12 months?
    answer: "{{ a.d9_km_s12 }}"
    tolerance_abs: 0.5
    unit: '%'
    explanation: KM.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C274
    prompt: "Average churn month among churners ({{ a.d9_naive_mean_churners }}) is biased because…"
    options:
    - id: a
      text: It ignores those still active (censored)
      correct: true
      why: Selection on early exits.
    - id: b
      text: Rounding
      why: No.
    - id: c
      text: It's unbiased
      why: No.
    - id: d
      text: Seasonality
      why: No.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C274
    prompt: Log-rank compares…
    options:
    - id: a
      text: Survival curves between groups
      correct: true
      why: Overall difference.
    - id: b
      text: Means
      why: No.
    - id: c
      text: Hazard ratios
      why: Cox.
    - id: d
      text: Medians only
      why: No.
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C275
    prompt: Cox HR per complaint?
    answer: "{{ a.d9_cox.complaints_12m.hr }}"
    tolerance_abs: 0.05
    explanation: Hazard × per complaint.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C274
    prompt: When the median isn't reached, report…
    options:
    - id: a
      text: Restricted mean survival time
      correct: true
      why: Area under KM.
    - id: b
      text: Mean of churners
      why: Biased.
    - id: c
      text: Nothing
      why: No.
    - id: d
      text: Max follow-up
      why: No.
  - id: t1
    type: numeric
    difficulty: 2
    prompt: KM survival (%) at 24 months?
    answer: "{{ a.d9_km_s24 }}"
    tolerance_abs: 0.5
    explanation: F13.
    concepts: *id003
  - id: t2
    type: mcq
    difficulty: 2
    prompt: "Hazard ratio for digital share per 10 points {{ a.d9_cox.digital_share_10pp.hr }} means…"
    options:
    - id: a
      text: Each +10 points of digital use lowers the churn hazard by about 11%
      correct: true
      why: HR < 1 protective.
    - id: b
      text: Raises churn
      why: HR < 1.
    - id: c
      text: No effect
      why: Significant.
    - id: d
      text: 11% churn
      why: It's relative.
    concepts: *id003
- id: L9.2-L
  title: L9.2 Retention (Leader)
  lesson: L9.2
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts: &id004
    - C274
    prompt: A deck says 'average customer lifetime is 10.6 months'. Response?
    options:
    - id: a
      text: That's churners only; use KM survival at fixed horizons
      correct: true
      why: Censoring.
    - id: b
      text: Accept
      why: Biased.
    - id: c
      text: Ask for median of churners
      why: Still biased.
    - id: d
      text: Ignore
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C275
    prompt: "Complaints HR ≈ {{ a.d9_cox.complaints_12m.hr }}. Best use?"
    options:
    - id: a
      text: Trigger service recovery after a complaint
      correct: true
      why: Actionable signal.
    - id: b
      text: Stop accepting complaints
      why: No.
    - id: c
      text: Claim complaints cause churn
      why: Association.
    - id: d
      text: Ignore
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C274
    prompt: Propose a retention KPI.
    model: "KM survival at 12 months by origination cohort ({{ a.d9_km_s12 }}% overall), with RMST to 24 months; tracked monthly by channel."
    rubric: 'Full: KM horizon + cohort. Partial: churn rate.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C275
    prompt: Proportional hazards means…
    options:
    - id: a
      text: The HR is constant over time
      correct: true
      why: "Checked: {{ a.d9_ph_hr_early }} vs {{ a.d9_ph_hr_late }}."
    - id: b
      text: Hazards are equal
      why: No.
    - id: c
      text: Survival is linear
      why: No.
    - id: d
      text: No censoring
      why: No.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: Retention team wants 'average lifetime'. Offer?
    options:
    - id: a
      text: "Restricted mean survival to 24 months ({{ a.d9_rmst24 }} months)"
      correct: true
      why: RMST handles censoring.
    - id: b
      text: Mean of churners
      why: Biased.
    - id: c
      text: Max tenure
      why: No.
    - id: d
      text: Nothing
      why: No.
    concepts: *id004
- id: L9.3-F
  title: L9.3 Deep learning (Basic → Advanced)
  lesson: L9.3
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts: &id005
    - C282
    prompt: An activation function provides…
    options:
    - id: a
      text: Non-linearity between layers
      correct: true
      why: Otherwise linear.
    - id: b
      text: Regularisation
      why: Different.
    - id: c
      text: Scaling
      why: No.
    - id: d
      text: Data
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C282
    prompt: MLP test AUC on default?
    answer: "{{ a.d9_dl_auc.mlp }}"
    tolerance_abs: 0.03
    explanation: "vs logistic {{ a.d9_dl_auc.logistic }}."
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C282
    prompt: For tabular business data, the default first choice is…
    options:
    - id: a
      text: Gradient boosting or a GLM
      correct: true
      why: Strong, cheap.
    - id: b
      text: Transformer
      why: Overkill.
    - id: c
      text: CNN
      why: Images.
    - id: d
      text: RNN
      why: Sequences.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C285
    prompt: Embeddings are…
    options:
    - id: a
      text: Vectors where distance reflects similarity
      correct: true
      why: Representation.
    - id: b
      text: Images
      why: No.
    - id: c
      text: Hyperparameters
      why: No.
    - id: d
      text: Labels
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C285
    prompt: RAG reduces hallucination by…
    options:
    - id: a
      text: Grounding answers in retrieved documents
      correct: true
      why: Citable.
    - id: b
      text: Bigger models
      why: Not reliably.
    - id: c
      text: Lower temperature only
      why: Partial.
    - id: d
      text: Removing data
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C282
    prompt: "With 1,500 rows the MLP fell to {{ a.d9_dl_small_auc.mlp }}. Why?"
    options:
    - id: a
      text: Many parameters, little data — overfitting/instability
      correct: true
      why: "{{ a.d9_dl_n_params }} parameters."
    - id: b
      text: Bug
      why: No.
    - id: c
      text: Wrong metric
      why: No.
    - id: d
      text: Too many features
      why: Eight.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: Weight decay in an MLP is the same idea as…
    options:
    - id: a
      text: Ridge (L2) regularisation
      correct: true
      why: Penalty on weights.
    - id: b
      text: Bootstrap
      why: No.
    - id: c
      text: PCA
      why: No.
    - id: d
      text: Cross-entropy
      why: Loss.
    concepts: *id005
  - id: t2
    type: mcq
    difficulty: 2
    prompt: For shelf photos, the first choice is…
    options:
    - id: a
      text: A convolutional / pretrained vision model
      correct: true
      why: Images = DL home turf.
    - id: b
      text: Logistic regression
      why: Pixels need features.
    - id: c
      text: K-means
      why: Unsupervised.
    - id: d
      text: ARIMA
      why: No.
    concepts: *id005
- id: L9.3-L
  title: L9.3 AI decisions (Leader)
  lesson: L9.3
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts: &id006
    - C282
    prompt: 'Vendor: ''Our neural net beats your forecasts by 30%.'' First ask?'
    options:
    - id: a
      text: Out-of-time backtest vs our baseline on the same split
      correct: true
      why: Fair comparison.
    - id: b
      text: Price
      why: Later.
    - id: c
      text: Architecture
      why: Secondary.
    - id: d
      text: References
      why: Weak.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C286
    prompt: Most important LLM governance control?
    options:
    - id: a
      text: No personal data in unapproved tools + human review
      correct: true
      why: Privacy, accuracy.
    - id: b
      text: Use the biggest model
      why: No.
    - id: c
      text: Ban all use
      why: Too blunt.
    - id: d
      text: Let each team decide
      why: Inconsistent.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C282
    prompt: When would you fund deep learning?
    model: For unstructured data (images, text, audio) or very large sequential data where features are hard to hand-craft, after a pilot beats a strong simple baseline on held-out data.
    rubric: 'Full: data type + baseline test. Partial: one.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C282
    prompt: An MLP adds what burden in credit?
    options:
    - id: a
      text: Explainability for adverse-action reasons
      correct: true
      why: Regulation.
    - id: b
      text: None
      why: No.
    - id: c
      text: Lower accuracy always
      why: Not always.
    - id: d
      text: Data deletion
      why: No.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: An LLM summary quotes a policy that doesn't exist. Root cause and fix?
    options:
    - id: a
      text: Hallucination — ground with RAG and citations, add review
      correct: true
      why: Grounding.
    - id: b
      text: Bigger model
      why: Doesn't guarantee.
    - id: c
      text: Ignore
      why: Compliance risk.
    - id: d
      text: Retrain logistic
      why: No.
    concepts: *id006
- id: L9.4-F
  title: L9.4 Insurance and risk (Basic → Advanced)
  lesson: L9.4
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 2
    concepts: &id007
    - C264
    prompt: Exposure enters a frequency GLM as…
    options:
    - id: a
      text: An offset (log exposure)
      correct: true
      why: Rate model.
    - id: b
      text: A weight only
      why: No.
    - id: c
      text: The target
      why: No.
    - id: d
      text: Ignored
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C265
    prompt: Share (%) of losses from the top 3 claims?
    answer: "{{ a.d9_ins_top3_share }}"
    tolerance_abs: 1
    unit: '%'
    explanation: F17.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C266
    prompt: Expected shortfall at 99.5% is…
    options:
    - id: a
      text: Average loss beyond the 99.5% VaR
      correct: true
      why: Tail mean.
    - id: b
      text: The 99.5% quantile
      why: VaR.
    - id: c
      text: Expected loss
      why: No.
    - id: d
      text: Premium
      why: No.
  - id: q4
    type: numeric
    difficulty: 2
    concepts:
    - C266
    prompt: Credit VaR 99.9% (millions)?
    answer: "{{ a.d9_cr_var999 }}"
    tolerance_abs: 3
    explanation: Vasicek.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C266
    prompt: Correlation between defaults…
    options:
    - id: a
      text: Fattens the loss tail (raises VaR) without changing EL
      correct: true
      why: Clustering.
    - id: b
      text: Raises EL
      why: No.
    - id: c
      text: Has no effect
      why: No.
    - id: d
      text: Lowers VaR
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C265
    prompt: Best treatment of catastrophic claims in pricing?
    options:
    - id: a
      text: Price attritional losses + large-loss loading/reinsurance
      correct: true
      why: Stable.
    - id: b
      text: Delete them
      why: Under-prices.
    - id: c
      text: Average them in
      why: Volatile.
    - id: d
      text: Ignore severity
      why: No.
  - id: t1
    type: numeric
    difficulty: 2
    prompt: Insurance loss ratio excluding the 3 catastrophic claims?
    answer: "{{ a.d9_ins_loss_ratio_excat }}"
    tolerance_abs: 0.02
    explanation: "vs {{ a.d9_ins_loss_ratio }} with them."
    concepts: *id007
  - id: t2
    type: mcq
    difficulty: 2
    prompt: Capital = VaR − expected loss covers…
    options:
    - id: a
      text: Unexpected loss
      correct: true
      why: EL priced, UL capitalised.
    - id: b
      text: Expected loss
      why: Priced in.
    - id: c
      text: All losses
      why: No.
    - id: d
      text: Profit
      why: No.
    concepts: *id007
- id: L9.4-L
  title: L9.4 Risk appetite (Leader)
  lesson: L9.4
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts: &id008
    - C265
    prompt: "Loss ratio {{ a.d9_ins_loss_ratio }}. Action?"
    options:
    - id: a
      text: Reprice and/or reinsure the tail
      correct: true
      why: Unprofitable.
    - id: b
      text: Grow the book
      why: Grows losses.
    - id: c
      text: Wait
      why: No.
    - id: d
      text: Remove catastrophic claims from reports
      why: Hides risk.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C267
    prompt: Stress tests answer…
    options:
    - id: a
      text: What if a severe scenario happens
      correct: true
      why: Scenario.
    - id: b
      text: How likely it is
      why: VaR.
    - id: c
      text: Average loss
      why: EL.
    - id: d
      text: Nothing
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C266
    prompt: Write a risk-appetite statement for the credit book.
    model: "We hold capital to absorb a 1-in-1,000-year credit loss (VaR 99.9% ≈ {{ a.d9_cr_var999 }}M vs EL {{ a.d9_cr_el }}M) and review quarterly a stress of PD × 2.5 (EL {{ a.d9_cr_stress_el }}M)."
    rubric: 'Full: percentile + numbers + stress. Partial: percentile.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C266
    prompt: Why prefer ES to VaR for tail risk?
    options:
    - id: a
      text: ES reflects how bad losses are beyond the threshold
      correct: true
      why: Tail-sensitive.
    - id: b
      text: ES is smaller
      why: It's larger.
    - id: c
      text: VaR is illegal
      why: No.
    - id: d
      text: No difference
      why: No.
  - id: t1
    type: mcq
    difficulty: 2
    prompt: "A stress of PD × 2.5 raises EL to {{ a.d9_cr_stress_el }}M. Use?"
    options:
    - id: a
      text: Set limits and contingency plans for a downturn
      correct: true
      why: Scenario planning.
    - id: b
      text: Ignore — unlikely
      why: Stress tests matter.
    - id: c
      text: Publish as forecast
      why: It's a scenario.
    - id: d
      text: Delete
      why: No.
    concepts: *id008
- id: L9.5-F
  title: L9.5 Fairness (Basic → Advanced)
  lesson: L9.5
  track: F
  questions:
  - id: q1
    type: numeric
    difficulty: 2
    concepts: &id009
    - C216
    prompt: Disparate impact ratio (B ÷ A approvals)?
    answer: "{{ a.d9_di }}"
    tolerance_abs: 0.01
    explanation: < 0.8.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C216
    prompt: "Outside R4 the ratio is {{ a.d9_di_nonR4 }}. Implication?"
