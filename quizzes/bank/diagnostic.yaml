quizzes:
  - id: DIAG
    title: Pre-bootcamp diagnostic (40 questions, same blueprint as the final test)
    lesson: L0.0
    track: Mixed
    pass_mark: 75
    questions:
      - {id: d01, type: mcq, difficulty: 1, concepts: [C022], prompt: "Household incomes are heavily right-skewed. Which summary best describes a 'typical' household?",
         options: [{id: a, text: "Median", correct: true, why: "Robust to the long right tail."}, {id: b, text: "Mean", why: "Pulled up by very high incomes."}, {id: c, text: "Maximum", why: "Extreme by definition."}, {id: d, text: "Range", why: "A spread measure, not a centre."}]}
      - {id: d02, type: mcq, difficulty: 1, concepts: [C029], prompt: "The interquartile range is…",
         options: [{id: a, text: "75th percentile minus 25th percentile", correct: true, why: "Spread of the middle half."}, {id: b, text: "Max minus min", why: "That is the range."}, {id: c, text: "Mean ± 1 SD", why: "Different concept."}, {id: d, text: "Median of absolute deviations", why: "That is the MAD."}]}
      - {id: d03, type: mcq, difficulty: 2, concepts: [C031], prompt: "To compare variability of weekly sales between a big and a small store, use…",
         options: [{id: a, text: "Coefficient of variation (SD ÷ mean)", correct: true, why: "Scale-free."}, {id: b, text: "Standard deviation", why: "Depends on scale."}, {id: c, text: "Variance", why: "Depends on scale (squared)."}, {id: d, text: "Mode", why: "Not a spread measure."}]}
      - {id: d04, type: mcq, difficulty: 2, concepts: [C015], prompt: "Income is missing more often for applicants who are riskier, and riskiness is not fully captured by other fields. This is…",
         options: [{id: a, text: "MNAR (missing not at random)", correct: true, why: "Missingness depends on the unobserved value/risk."}, {id: b, text: "MCAR", why: "Would be unrelated to anything."}, {id: c, text: "MAR", why: "Would be explained by observed fields."}, {id: d, text: "Not missingness", why: "It is."}]}
      - {id: d05, type: mcq, difficulty: 2, concepts: [C046], prompt: "Which outlier rule is most robust for skewed spend data?",
         options: [{id: a, text: "Modified z-score using the median and MAD", correct: true, why: "Not distorted by the outliers themselves."}, {id: b, text: "Mean ± 3 SD", why: "SD is inflated by outliers."}, {id: c, text: "Remove the top 5% always", why: "Arbitrary; deletes genuine customers."}, {id: d, text: "Remove negative values", why: "Not an outlier rule."}]}
      - {id: d06, type: mcq, difficulty: 2, concepts: [C055], prompt: "Price and quantity have a strong curved but monotone relationship. Which correlation fits?",
         options: [{id: a, text: "Spearman", correct: true, why: "Captures monotone relationships via ranks."}, {id: b, text: "Pearson", why: "Measures linear association only."}, {id: c, text: "Covariance", why: "Not standardised."}, {id: d, text: "Cramér's V", why: "For categorical variables."}]}
      - {id: d07, type: mcq, difficulty: 2, concepts: [C070], prompt: "A promotion lowers average units per line overall, but raises it within every store format. This is…",
         options: [{id: a, text: "Simpson's paradox", correct: true, why: "Aggregation over an unevenly distributed third variable reverses the effect."}, {id: b, text: "Regression to the mean", why: "Different phenomenon."}, {id: c, text: "Survivorship bias", why: "Not about missing units."}, {id: d, text: "Multicollinearity", why: "A regression issue."}]}
      - {id: d08, type: mcq, difficulty: 2, concepts: [C068], prompt: "Analysing only currently stocked SKUs to judge last year's range performance risks…",
         options: [{id: a, text: "Survivorship bias", correct: true, why: "Delisted (poor) SKUs are missing."}, {id: b, text: "Overfitting", why: "No model."}, {id: c, text: "Type II error", why: "Not specifically."}, {id: d, text: "Heteroscedasticity", why: "No."}]}
      - {id: d09, type: mcq, difficulty: 3, concepts: [C078, C079], prompt: "Fraud is 1% of transactions. An alert flags 90% of frauds and 5% of genuine transactions. Roughly what share of alerts are fraud?",
         options: [{id: a, text: "About 15%", correct: true, why: "0.9×1% ÷ (0.9×1% + 5%×99%) ≈ 0.009/0.0585 ≈ 15%."}, {id: b, text: "90%", why: "Confuses sensitivity with precision."}, {id: c, text: "95%", why: "Confuses specificity with precision."}, {id: d, text: "50%", why: "No basis."}]}
      - {id: d10, type: mcq, difficulty: 2, concepts: [C085], prompt: "Weekly SKU sales have variance far above the mean. Which distribution fits better than Poisson?",
         options: [{id: a, text: "Negative binomial", correct: true, why: "Allows over-dispersion."}, {id: b, text: "Bernoulli", why: "Single yes/no."}, {id: c, text: "Uniform", why: "No."}, {id: d, text: "Normal with negative values", why: "Counts cannot be negative."}]}
      - {id: d11, type: mcq, difficulty: 2, concepts: [C092], prompt: "Basket spend is positive and right-skewed. A natural first distribution to try is…",
         options: [{id: a, text: "Lognormal", correct: true, why: "Log of spend is often roughly normal."}, {id: b, text: "Binomial", why: "For counts of successes."}, {id: c, text: "Uniform", why: "No."}, {id: d, text: "Cauchy", why: "Pathological tails; rarely appropriate."}]}
      - {id: d12, type: mcq, difficulty: 2, concepts: [C106], prompt: "The central limit theorem says that…",
         options: [{id: a, text: "Sample means are approximately normal for large enough samples, whatever the data's shape (finite variance)", correct: true, why: "Basis for t- and z-tests on means."}, {id: b, text: "All data are normal", why: "No."}, {id: c, text: "Large samples have no outliers", why: "No."}, {id: d, text: "Medians equal means", why: "No."}]}
      - {id: d13, type: mcq, difficulty: 2, concepts: [C109], prompt: "Benford's law is most useful for…",
         options: [{id: a, text: "Screening naturally occurring amounts spanning several orders of magnitude for fabrication", correct: true, why: "First digits follow a log pattern in such data."}, {id: b, text: "Testing normality", why: "No."}, {id: c, text: "Choosing k in K-means", why: "No."}, {id: d, text: "Forecasting", why: "No."}]}
      - {id: d14, type: mcq, difficulty: 2, concepts: [C114, C172], prompt: "When two predictors are almost perfectly correlated, the regression…",
         options: [{id: a, text: "Has unstable coefficients with large standard errors (multicollinearity)", correct: true, why: "The design matrix is near-singular."}, {id: b, text: "Becomes more accurate", why: "Not for interpretation."}, {id: c, text: "Cannot be fitted ever", why: "Only if perfectly collinear."}, {id: d, text: "Has heteroscedastic errors", why: "Different issue."}]}
      - {id: d15, type: mcq, difficulty: 2, concepts: [C120], prompt: "A 95% confidence interval for a mean is 10 to 14. The best interpretation:",
         options: [{id: a, text: "The procedure captures the true mean in 95% of repeated samples; 10–14 are plausible values", correct: true, why: "Frequentist meaning."}, {id: b, text: "95% of customers are between 10 and 14", why: "That would be a prediction/tolerance interval."}, {id: c, text: "There is a 95% chance the sample mean is 12", why: "The sample mean is known."}, {id: d, text: "The mean is 12 for sure", why: "No."}]}
      - {id: d16, type: mcq, difficulty: 2, concepts: [C122], prompt: "The bootstrap estimates uncertainty by…",
         options: [{id: a, text: "Resampling the observed data with replacement many times", correct: true, why: "Approximates the sampling distribution."}, {id: b, text: "Collecting new data", why: "No."}, {id: c, text: "Assuming normality", why: "It avoids that assumption."}, {id: d, text: "Dropping outliers", why: "No."}]}
      - {id: d17, type: mcq, difficulty: 2, concepts: [C126], prompt: "p = 0.03 means…",
         options: [{id: a, text: "If there were no true effect, data this extreme would occur about 3% of the time", correct: true, why: "Correct definition."}, {id: b, text: "There is a 3% chance there is no effect", why: "Common misreading."}, {id: c, text: "The effect is 3%", why: "p is not an effect size."}, {id: d, text: "The result is 97% likely to replicate", why: "No."}]}
      - {id: d18, type: mcq, difficulty: 2, concepts: [C127], prompt: "A Type II error is…",
         options: [{id: a, text: "Failing to detect a real effect", correct: true, why: "False negative; probability β."}, {id: b, text: "Detecting an effect that is not there", why: "Type I."}, {id: c, text: "Using the wrong test", why: "Not a type of error in this sense."}, {id: d, text: "A data-entry error", why: "No."}]}
      - {id: d19, type: mcq, difficulty: 2, concepts: [C129], prompt: "Comparing mean basket value between two independent groups with unequal variances: use…",
         options: [{id: a, text: "Welch's t-test", correct: true, why: "Does not assume equal variances."}, {id: b, text: "Paired t-test", why: "Groups are independent."}, {id: c, text: "Chi-square test", why: "Categorical data."}, {id: d, text: "McNemar's test", why: "Paired binary."}]}
      - {id: d20, type: mcq, difficulty: 2, concepts: [C139], prompt: "A 2×2 table has expected counts of 2 and 3 in some cells. Use…",
         options: [{id: a, text: "Fisher's exact test", correct: true, why: "Valid with small expected counts."}, {id: b, text: "Chi-square test", why: "Approximation fails."}, {id: c, text: "t-test", why: "Binary outcome."}, {id: d, text: "ANOVA", why: "No."}]}
      - {id: d21, type: mcq, difficulty: 2, concepts: [C135, C137], prompt: "Comparing a skewed outcome across four regions with small samples, the safer test is…",
         options: [{id: a, text: "Kruskal-Wallis", correct: true, why: "Rank-based, no normality needed."}, {id: b, text: "Four separate t-tests", why: "Multiple testing."}, {id: c, text: "Paired t-test", why: "No."}, {id: d, text: "Fisher's exact", why: "For counts."}]}
      - {id: d22, type: mcq, difficulty: 3, concepts: [C148], prompt: "You test 40 segments at α = 0.05 and want to control the false discovery rate. Use…",
         options: [{id: a, text: "Benjamini-Hochberg", correct: true, why: "Controls FDR."}, {id: b, text: "No correction", why: "Expect ~2 false positives."}, {id: c, text: "A one-sided test", why: "Doesn't address multiplicity."}, {id: d, text: "Increase sample size only", why: "Does not control the error rate across tests."}]}
      - {id: d23, type: mcq, difficulty: 3, concepts: [C152], prompt: "A 50/50 A/B test ends with 52.6% / 47.4% of users. First step?",
         options: [{id: a, text: "Sample-ratio-mismatch check; investigate assignment/logging before reading results", correct: true, why: "SRM signals a broken experiment."}, {id: b, text: "Read the conversion lift", why: "Results may be biased."}, {id: c, text: "Reweight to 50/50 and proceed", why: "Does not fix the bias's cause."}, {id: d, text: "Ignore — close enough", why: "With thousands of users it is not."}]}
      - {id: d24, type: mcq, difficulty: 3, concepts: [C156], prompt: "CUPED reduces variance in an experiment by…",
         options: [{id: a, text: "Adjusting the outcome with a pre-experiment covariate", correct: true, why: "Removes predictable variation."}, {id: b, text: "Removing outliers", why: "Different technique."}, {id: c, text: "Stopping early", why: "No."}, {id: d, text: "Using a smaller alpha", why: "No."}]}
      - {id: d25, type: mcq, difficulty: 3, concepts: [C164], prompt: "Adjusting for a variable that is caused by both the treatment and the outcome (a collider)…",
         options: [{id: a, text: "Can create a spurious association", correct: true, why: "Collider bias."}, {id: b, text: "Always reduces bias", why: "Not for colliders."}, {id: c, text: "Has no effect", why: "It can."}, {id: d, text: "Is required", why: "No."}]}
      - {id: d26, type: mcq, difficulty: 2, concepts: [C175], prompt: "In logistic regression, an odds ratio of 2 for 'contract employment' means…",
         options: [{id: a, text: "The odds of default are twice those of the reference group, holding other variables constant", correct: true, why: "Odds, not probability."}, {id: b, text: "Default probability is exactly double", why: "Only approximately when events are rare."}, {id: c, text: "Two extra defaults per 100", why: "That is a risk difference."}, {id: d, text: "Contract employment causes default", why: "Association, not causation."}]}
      - {id: d27, type: mcq, difficulty: 3, concepts: [C182], prompt: "Modelling claim counts with clear over-dispersion, choose…",
         options: [{id: a, text: "Negative binomial GLM (with exposure offset)", correct: true, why: "Handles variance > mean."}, {id: b, text: "OLS on counts", why: "Can predict negatives; wrong variance."}, {id: c, text: "Logistic regression", why: "Binary outcome only."}, {id: d, text: "K-means", why: "No."}]}
      - {id: d28, type: mcq, difficulty: 2, concepts: [C178], prompt: "Lasso differs from Ridge because Lasso…",
         options: [{id: a, text: "Can shrink some coefficients exactly to zero (feature selection)", correct: true, why: "L1 penalty."}, {id: b, text: "Never shrinks coefficients", why: "It does."}, {id: c, text: "Is only for classification", why: "No."}, {id: d, text: "Removes the intercept", why: "No."}]}
      - {id: d29, type: mcq, difficulty: 3, concepts: [C202], prompt: "A default model reaches AUC 0.98 using `collections_flag`. This is most likely…",
         options: [{id: a, text: "Target leakage", correct: true, why: "The field is recorded after delinquency."}, {id: b, text: "A great model", why: "Too good to be true."}, {id: c, text: "Underfitting", why: "Opposite."}, {id: d, text: "Class imbalance", why: "Not the explanation."}]}
      - {id: d30, type: mcq, difficulty: 2, concepts: [C198], prompt: "For a credit model that will score future applicants, the most honest validation is…",
         options: [{id: a, text: "Out-of-time validation on later vintages", correct: true, why: "Mimics deployment."}, {id: b, text: "Random split only", why: "Can hide drift."}, {id: c, text: "Training-set accuracy", why: "Optimistic."}, {id: d, text: "No validation", why: "No."}]}
      - {id: d31, type: mcq, difficulty: 2, concepts: [C207], prompt: "For fraud at 0.7% prevalence, which metric is most informative?",
         options: [{id: a, text: "PR-AUC / precision at the investigated volume", correct: true, why: "Focuses on the rare class."}, {id: b, text: "Accuracy", why: "Dominated by the majority class."}, {id: c, text: "R²", why: "Regression metric."}, {id: d, text: "MAPE", why: "Forecasting metric."}]}
      - {id: d32, type: mcq, difficulty: 2, concepts: [C208], prompt: "In credit scoring, the KS statistic measures…",
         options: [{id: a, text: "Maximum gap between cumulative score distributions of goods and bads", correct: true, why: "Separation."}, {id: b, text: "Calibration", why: "That is reliability/Brier."}, {id: c, text: "Correlation between features", why: "No."}, {id: d, text: "Forecast bias", why: "No."}]}
      - {id: d33, type: mcq, difficulty: 2, concepts: [C219], prompt: "A score PSI of 0.28 versus the development sample typically means…",
         options: [{id: a, text: "Significant population shift — investigate (rule of thumb > 0.25)", correct: true, why: "Common banding."}, {id: b, text: "Model is more accurate", why: "PSI is not performance."}, {id: c, text: "Nothing", why: "It is above usual action bands."}, {id: d, text: "Data are normal", why: "No."}]}
      - {id: d34, type: mcq, difficulty: 2, concepts: [C230], prompt: "A SKU sells zero in most weeks. A suitable forecasting approach is…",
         options: [{id: a, text: "Croston / SBA, evaluated with MASE", correct: true, why: "Designed for intermittent demand."}, {id: b, text: "MAPE-optimised ARIMA", why: "MAPE undefined at zero."}, {id: c, text: "Linear regression on time", why: "Ignores intermittency."}, {id: d, text: "No forecast possible", why: "There are methods."}]}
      - {id: d35, type: mcq, difficulty: 2, concepts: [C233], prompt: "Forecasting demand from sales history during frequent stockouts will…",
         options: [{id: a, text: "Under-estimate demand (sales are censored)", correct: true, why: "Lost sales are not recorded."}, {id: b, text: "Over-estimate demand", why: "Opposite."}, {id: c, text: "Have no effect", why: "It does."}, {id: d, text: "Only affect price elasticity", why: "Affects levels."}]}
      - {id: d36, type: mcq, difficulty: 2, concepts: [C236], prompt: "Before running K-means on revenue and visit counts you should…",
         options: [{id: a, text: "Scale the features", correct: true, why: "Otherwise revenue dominates distances."}, {id: b, text: "Add customer IDs as a feature", why: "Meaningless."}, {id: c, text: "Use only one feature", why: "Not required."}, {id: d, text: "Nothing", why: "Scaling matters."}]}
      - {id: d37, type: mcq, difficulty: 2, concepts: [C245], prompt: "Market-basket 'lift' of 3 for A → B means…",
         options: [{id: a, text: "B is 3 times as likely in baskets with A as in baskets overall", correct: true, why: "Confidence ÷ support of B."}, {id: b, text: "Sales of B tripled", why: "No."}, {id: c, text: "3 baskets contain both", why: "That is a count."}, {id: d, text: "A causes B", why: "Association only."}]}
      - {id: d38, type: mcq, difficulty: 2, concepts: [C246], prompt: "An own-price elasticity of −1.8 means a 10% price cut changes units by about…",
         options: [{id: a, text: "+18%", correct: true, why: "% change in units ≈ elasticity × % change in price."}, {id: b, text: "−18%", why: "Sign error."}, {id: c, text: "+1.8%", why: "Scale error."}, {id: d, text: "+10%", why: "Ignores elasticity."}]}
      - {id: d39, type: mcq, difficulty: 3, concepts: [C269], prompt: "Difference-in-differences relies mainly on…",
         options: [{id: a, text: "Parallel trends between treated and control before treatment", correct: true, why: "Key identifying assumption."}, {id: b, text: "Random assignment", why: "Not required."}, {id: c, text: "Normal residuals", why: "Secondary."}, {id: d, text: "Equal group sizes", why: "Not required."}]}
      - {id: d40, type: mcq, difficulty: 3, concepts: [C274], prompt: "70% of customers have not churned by the end of observation. To estimate time to churn, use…",
         options: [{id: a, text: "Kaplan-Meier / survival methods that handle censoring", correct: true, why: "Censored customers still carry information."}, {id: b, text: "Average churn month of churners only", why: "Biased downward."}, {id: c, text: "Drop non-churners", why: "Biased."}, {id: d, text: "Linear regression on churn month", why: "Ignores censoring."}]}
