quizzes:
- id: L6.1-F
  title: L6.1 Features (Basic → Advanced)
  lesson: L6.1
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C189
    prompt: A feature may use information…
    options:
    - id: a
      text: Only up to the observation point (when the prediction is made)
      correct: true
      why: Otherwise leakage.
    - id: b
      text: From any period
      why: Leakage.
    - id: c
      text: From the outcome window
      why: Leakage.
    - id: d
      text: Only from last week
      why: Too narrow.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C189
    prompt: Honest test AUC of the retail repeat-purchase model?
    answer: "{{ a.d6_r_auc_logit }}"
    tolerance_abs: 0.03
    explanation: No signal.
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C189
    prompt: AUC when features are computed over weeks 1–104?
    answer: "{{ a.d6_r_auc_leaky }}"
    tolerance_abs: 0.01
    explanation: Temporal leakage.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C189
    prompt: Why does recency at week 104 leak?
    options:
    - id: a
      text: It reveals whether the customer shopped after week 78 — the target
      correct: true
      why: Outcome-window data.
    - id: b
      text: It's correlated with revenue
      why: Not the issue.
    - id: c
      text: It's skewed
      why: No.
    - id: d
      text: It doesn't
      why: It does.
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C189
    prompt: AUC gain from adding months 1–3 behaviour to the GBM default model?
    answer: "{{ a.d6_beh_gain }}"
    tolerance_abs: 0.008
    explanation: Legitimate signal.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C189
    prompt: Income missing is associated with higher default (F02). Best handling?
    options:
    - id: a
      text: Impute and add a missing-indicator feature
      correct: true
      why: Missingness is informative.
    - id: b
      text: Drop missing rows
      why: Loses signal and biases.
    - id: c
      text: Fill with 0
      why: Distorts.
    - id: d
      text: Ignore
      why: No.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C190
    prompt: Embedded feature selection means…
    options:
    - id: a
      text: Selection happens during model fitting (lasso, tree importance)
      correct: true
      why: Built into training.
    - id: b
      text: Univariate tests
      why: Filter.
    - id: c
      text: Trying subsets
      why: Wrapper.
    - id: d
      text: Manual choice
      why: No.
  - id: q8
    type: tf_reason
    difficulty: 2
    concepts:
    - C189
    prompt: 'True or false: ''no signal'' is a failed project.'
    options:
    - id: a
      text: False — it is a valid finding that prevents wasted targeting
      correct: true
      why: Evidence either way.
    - id: b
      text: 'True'
      why: No.
    - id: c
      text: True unless AUC > 0.7
      why: No.
- id: L6.1-L
  title: L6.1 Feature governance (Leader)
  lesson: L6.1
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C189
    prompt: A CRM model scores AUC 0.99. First action?
    options:
    - id: a
      text: Leakage audit — draw each feature's window vs the observation point
      correct: true
      why: Too good to be true.
    - id: b
      text: Deploy
      why: No.
    - id: c
      text: Tune further
      why: No.
    - id: d
      text: Present to board
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C189
    prompt: A feature specification must include…
    options:
    - id: a
      text: Definition, time window, source/owner, missing handling, leakage check
      correct: true
      why: Reviewable and production-ready.
    - id: b
      text: Only the name
      why: No.
    - id: c
      text: Its importance
      why: Insufficient.
    - id: d
      text: The SQL only
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C189
    prompt: Tell CRM what the honest repeat-purchase result means for them.
    model: Past shopping patterns don't tell us who will come back next half-year (AUC ≈ 0.5), so targeting 'likely returners' from history wouldn't beat random selection. Spend the budget on testing offers (A/B) or on signals we don't yet capture.
    rubric: 'Full: no signal + implication + alternative. Partial: one.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C189
    prompt: Behavioural features at month 3 are legitimate because…
    options:
    - id: a
      text: They are known at the observation point (month 3) and precede the outcome window
      correct: true
      why: Timeline.
    - id: b
      text: They improve AUC
      why: Leaky ones do too.
    - id: c
      text: They are numeric
      why: No.
    - id: d
      text: Regulators like them
      why: Not the reason.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C190
    prompt: '500 candidate features: main governance risk?'
    options:
    - id: a
      text: Leakage, unstable sources and monitoring burden
      correct: true
      why: Operational.
    - id: b
      text: Too much accuracy
      why: No.
    - id: c
      text: None
      why: No.
    - id: d
      text: Storage
      why: Minor.
- id: L6.2-F
  title: L6.2 Trees and ensembles (Basic → Advanced)
  lesson: L6.2
  track: F
  questions:
  - id: q1
    type: numeric
    difficulty: 2
    concepts:
    - C191
    prompt: Train AUC of the unrestricted decision tree?
    answer: "{{ a.d6_tree_deep_train_auc }}"
    tolerance_abs: 0.01
    explanation: "Test {{ a.d6_models.tree_deep.auc }}."
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C192
    prompt: A random forest reduces overfitting by…
    options:
    - id: a
      text: Averaging many trees on bootstrap samples with random feature subsets
      correct: true
      why: Bagging.
    - id: b
      text: Using one deep tree
      why: No.
    - id: c
      text: Sequential correction
      why: Boosting.
    - id: d
      text: Removing features
      why: No.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C193
    prompt: Gradient boosting builds…
    options:
    - id: a
      text: Small trees sequentially, each correcting current errors
      correct: true
      why: Boosting.
    - id: b
      text: Independent deep trees
      why: Forest.
    - id: c
      text: A single linear model
      why: No.
    - id: d
      text: Clusters
      why: No.
  - id: q4
    type: numeric
    difficulty: 2
    concepts:
    - C193
    prompt: GBM test AUC minus logistic test AUC?
    answer: "{{ a.d6_gbm_gain }}"
    tolerance_abs: 0.01
    explanation: No gain here.
  - id: q5
    type: mcq
    difficulty: 3
    concepts:
    - C193
    prompt: Why doesn't GBM beat logistic on this credit data?
    options:
    - id: a
      text: Signal is mostly additive and monotone; engineered terms capture the rest
      correct: true
      why: Logistic + 3 terms ≈ GBM.
    - id: b
      text: GBM is broken
      why: No.
    - id: c
      text: Too little data
      why: 17,500 rows.
    - id: d
      text: Wrong metric
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C193
    prompt: When does boosting typically win?
    options:
    - id: a
      text: Many weak features, unengineered interactions, large data
      correct: true
      why: Complex signal.
    - id: b
      text: Small clean data
      why: Logistic fine.
    - id: c
      text: When explanations are needed
      why: Harder.
    - id: d
      text: Always
      why: No.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C191
    prompt: A depth-4 tree is useful for…
    options:
    - id: a
      text: Readable segmentation rules
      correct: true
      why: Interpretability.
    - id: b
      text: Best accuracy
      why: Usually not.
    - id: c
      text: Text
      why: No.
    - id: d
      text: Forecasting
      why: No.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C201
    prompt: "GBM train AUC {{ a.d6_gbm_train_auc }}, test {{ a.d6_models.gbm.auc }}. This gap indicates…"
    options:
    - id: a
      text: Some overfitting
      correct: true
      why: Gap > 0.05.
    - id: b
      text: Underfitting
      why: No.
    - id: c
      text: Leakage
      why: Leakage shows high test AUC.
    - id: d
      text: Nothing
      why: No.
- id: L6.2-L
  title: L6.2 Model choice (Leader)
  lesson: L6.2
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C193
    prompt: The team proposes replacing the logistic scorecard with GBM. Your requirement?
    options:
    - id: a
      text: Same out-of-time test, money impact, explainability and monitoring plan
      correct: true
      why: Complete case.
    - id: b
      text: Higher train AUC
      why: No.
    - id: c
      text: Vendor endorsement
      why: No.
    - id: d
      text: None
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C193
    prompt: Running costs of a GBM vs logistic include…
    options:
    - id: a
      text: Explainability tooling, validation effort, retraining, monitoring
      correct: true
      why: Total cost.
    - id: b
      text: None
      why: No.
    - id: c
      text: Only compute
      why: No.
    - id: d
      text: Licence fees only
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C193
    prompt: Write the recommendation on the GBM proposal for the credit committee.
    model: "Keep the logistic model. On the same test data GBM is no better (AUC {{ a.d6_models.gbm.auc }} vs {{ a.d6_models.logistic.auc }}) and degrades more out of time ({{ a.d6_oot_gbm_auc }} vs {{ a.d6_oot_logistic_auc }}), while adding explainability and monitoring costs. Run GBM as a monitored challenger and revisit when new data sources are added."
    rubric: 'Full: numbers + OOT + costs + challenger. Partial: 2.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C193
    prompt: A small AUC gain might still be worth it when…
    options:
    - id: a
      text: The portfolio is large and the gain translates into material losses avoided
      correct: true
      why: Money.
    - id: b
      text: Never
      why: Can be.
    - id: c
      text: It is statistically significant
      why: Not enough.
    - id: d
      text: The model is new
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C191
    prompt: Deep trees are acceptable when…
    options:
    - id: a
      text: Inside an ensemble (forest) — not alone
      correct: true
      why: Averaging.
    - id: b
      text: Always
      why: Overfit.
    - id: c
      text: For transparency
      why: Unreadable.
    - id: d
      text: Never
      why: In forests yes.
- id: L6.3-F
  title: L6.3 Other learners (Basic → Advanced)
  lesson: L6.3
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C194
    prompt: An SVM looks for…
    options:
    - id: a
      text: The boundary with the widest margin
      correct: true
      why: Max-margin.
    - id: b
      text: Nearest neighbours
      why: KNN.
    - id: c
      text: Independent likelihoods
      why: NB.
    - id: d
      text: Tree splits
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C195
    prompt: KNN requires…
    options:
    - id: a
      text: Scaled features and a distance metric
      correct: true
      why: Distances.
    - id: b
      text: No preprocessing
      why: Scaling essential.
    - id: c
      text: Labels at prediction
      why: No.
    - id: d
      text: Trees
      why: No.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C196
    prompt: Naive Bayes is a strong baseline for…
    options:
    - id: a
      text: Short text classification
      correct: true
      why: Fast, works with word counts.
    - id: b
      text: Calibrated PDs
      why: Poor calibration.
    - id: c
      text: Forecasting
      why: No.
    - id: d
      text: Images
      why: No.
  - id: q4
    type: numeric
    difficulty: 2
    concepts:
    - C194
    prompt: SVM test AUC in the bake-off?
    answer: "{{ a.d6_bake.svm_rbf.auc }}"
    tolerance_abs: 0.03
    explanation: "Logistic {{ a.d6_bake.logistic.auc }}."
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C196
    prompt: Naive Bayes Brier score?
    answer: "{{ a.d6_bake.naive_bayes.brier }}"
    tolerance_abs: 0.01
    explanation: Poorly calibrated.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C197
    prompt: Stacking helps most when base models are…
    options:
    - id: a
      text: Good and different
      correct: true
      why: Complementary errors.
    - id: b
      text: Identical
      why: No gain.
    - id: c
      text: Weak and similar
      why: No.
    - id: d
      text: Untrained
      why: No.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C197
    prompt: "Averaging three models' ranks scored {{ a.d6_bake.average_of_3_ranks.auc }} vs logistic {{ a.d6_bake.logistic.auc }}. Lesson?"
    options:
    - id: a
      text: Ensembles don't help when one model dominates
      correct: true
      why: Diminishing returns.
    - id: b
      text: Always ensemble
      why: No.
    - id: c
      text: Logistic is wrong
      why: No.
    - id: d
      text: Bug
      why: No.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C194
    prompt: Fair bake-off requirement?
    options:
    - id: a
      text: Same features, same split, same metrics
      correct: true
      why: Comparability.
    - id: b
      text: Each model its own test set
      why: Unfair.
    - id: c
      text: Vendor's data
      why: No.
    - id: d
      text: Training AUC
      why: No.
- id: L6.3-L
  title: L6.3 Vendor claims (Leader)
  lesson: L6.3
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts:
    - C194
    prompt: A vendor says their SVM is '95% accurate'. Response?
    options:
    - id: a
      text: Ask for AUC/PR-AUC on our data and split vs our baseline
      correct: true
      why: Accuracy meaningless at 4%.
    - id: b
      text: Buy
      why: No.
    - id: c
      text: Ask for 99%
      why: No.
    - id: d
      text: Ignore
      why: Test it.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C197
    prompt: An ensemble of 12 models adds 0.002 AUC. Decision?
    options:
    - id: a
      text: Usually not worth the complexity
      correct: true
      why: Diminishing returns.
    - id: b
      text: Always deploy
      why: No.
    - id: c
      text: Add more models
      why: No.
    - id: d
      text: Depends on colour
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C195
    prompt: Where would KNN or embeddings beat GBM in your organisation?
    model: Similarity problems — 'customers like this', product recommendations, matching complaints to past resolved cases, retrieval for RAG — where the question is 'what is close to this?' rather than predicting a label from tabular features.
    rubric: 'Full: similarity framing + 2 examples. Partial: 1 example.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C196
    prompt: Naive Bayes probabilities should be…
    options:
    - id: a
      text: Recalibrated before use as probabilities
      correct: true
      why: Poor calibration.
    - id: b
      text: Used directly
      why: No.
    - id: c
      text: Ignored
      why: Ranking may be useful.
    - id: d
      text: Squared
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C194
    prompt: Your vendor-evaluation protocol must fix…
    options:
    - id: a
      text: Data, split, metrics, baseline and acceptance thresholds in advance
      correct: true
      why: Pre-registration for models.
    - id: b
      text: Only the price
      why: No.
    - id: c
      text: Nothing
      why: No.
    - id: d
      text: The vendor's slides
      why: No.
- id: L6.4-F
  title: L6.4 Validation and leakage (Basic → Advanced)
  lesson: L6.4
  track: F
  questions:
  - id: q1
    type: numeric
    difficulty: 2
    concepts:
    - C202
    prompt: Test AUC with collections_flag and recovery_amount added?
    answer: "{{ a.d6_leak_gbm_auc }}"
    tolerance_abs: 0.01
    explanation: Leakage.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C202
    prompt: recovery_amount leaks because…
    options:
    - id: a
      text: It is recorded only after charge-off — after the outcome
      correct: true
      why: Post-outcome.
    - id: b
      text: It's large
      why: No.
    - id: c
      text: It's skewed
      why: No.
    - id: d
      text: It's missing
      why: No.
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C203
    prompt: Preprocessing leakage is prevented by…
    options:
    - id: a
      text: Fitting scalers/imputers inside a pipeline on training folds only
      correct: true
      why: No test information.
    - id: b
      text: Scaling all data first
      why: Leaks.
    - id: c
      text: No scaling
      why: Not always possible.
    - id: d
      text: Bigger test set
      why: No.
  - id: q4
    type: numeric
    difficulty: 2
    concepts:
    - C198
    prompt: Out-of-time AUC of the logistic model?
    answer: "{{ a.d6_oot_logistic_auc }}"
    tolerance_abs: 0.01
    explanation: "Random split {{ a.d6_models.logistic.auc }}."
  - id: q5
    type: mcq
    difficulty: 3
    concepts:
    - C198
    prompt: "OOT: predicted {{ a.d6_oot_logistic_pred_pct }}% vs actual {{ a.d6_oot_actual_pct }}%. Diagnosis?"
    options:
    - id: a
      text: Calibration failure — the 2025 population is riskier than training data
      correct: true
      why: Drift.
    - id: b
      text: Leakage
      why: No.
    - id: c
      text: Overfitting only
      why: Not the main issue.
    - id: d
      text: Random noise
      why: Too large.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C199
    prompt: Customers appear in several rows. Cross-validation should be…
    options:
    - id: a
      text: Grouped by customer
      correct: true
      why: Avoid group leakage.
    - id: b
      text: Shuffled rows
      why: Leaks.
    - id: c
      text: Unstratified
      why: No.
    - id: d
      text: Skipped
      why: No.
  - id: q7
    type: numeric
    difficulty: 2
    concepts:
    - C200
    prompt: Range of CV AUC across the 4 GBM settings?
    answer: "{{ a.d6_grid_range }}"
    tolerance_abs: 0.005
    explanation: Tuning matters little.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C201
    prompt: High bias, low variance describes…
    options:
    - id: a
      text: Simple models that may miss structure
      correct: true
      why: Underfit risk.
    - id: b
      text: Deep trees
      why: Opposite.
    - id: c
      text: Leaky models
      why: No.
    - id: d
      text: All models
      why: No.
- id: L6.4-L
  title: L6.4 Approving models (Leader)
  lesson: L6.4
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C202
    prompt: "'Explain why this score is suspicious': AUC {{ a.d6_leak_gbm_auc }} for credit default."
    options:
    - id: a
      text: "Far above norms (0.70–0.85); dominant feature {{ a.d6_leak_top }} is post-outcome"
      correct: true
      why: Leakage.
    - id: b
      text: Great data
      why: No.
    - id: c
      text: Lucky split
      why: No.
    - id: d
      text: It isn't
      why: It is.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C198
    prompt: Which validation is mandatory for a risk model?
    options:
    - id: a
      text: Out-of-time, with calibration
      correct: true
      why: Deployment reality.
    - id: b
      text: Random split only
      why: Optimistic.
    - id: c
      text: Training fit
      why: No.
    - id: d
      text: None
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C198
    prompt: What is the business impact of the OOT calibration gap and what do you do?
    model: "The model predicts ~{{ a.d6_oot_logistic_pred_pct }}% default where ~{{ a.d6_oot_actual_pct }}% occur — provisions and prices based on it would be ~40% too low for new business. Recalibrate on recent vintages (segmenting the partner channel), add monitoring of predicted vs actual by vintage, and review the partner channel's economics."
    rubric: 'Full: impact + recalibrate + monitor + root cause. Partial: 2.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C200
    prompt: Team wants a week for hyperparameter tuning. Better use?
    options:
    - id: a
      text: Feature work and out-of-time validation
      correct: true
      why: Bigger gains.
    - id: b
      text: More tuning
      why: ±0.01.
    - id: c
      text: New algorithm
      why: Little.
    - id: d
      text: Nothing
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C203
    prompt: Why are pipelines a control, not just tidy code?
    options:
    - id: a
      text: They guarantee preprocessing is fit only on training data and reproduced identically in production
      correct: true
      why: Leakage and consistency.
    - id: b
      text: Speed
      why: No.
    - id: c
      text: Style
      why: No.
    - id: d
      text: They aren't
      why: They are.
- id: L6.5-F
  title: L6.5 Imbalance (Basic → Advanced)
  lesson: L6.5
  track: F
  questions:
  - id: q1
    type: numeric
    difficulty: 1
    concepts:
    - C204
    prompt: Accuracy (%) of predicting 'no fraud' for everyone?
    answer: "{{ a.d6_allzero_acc }}"
