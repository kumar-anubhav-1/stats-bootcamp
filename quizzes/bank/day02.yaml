quizzes:
- id: L2.1-F
  title: L2.1 Probability and Bayes (Basic → Advanced)
  lesson: L2.1
  track: F
  questions:
  - id: q1
    type: numeric
    difficulty: 2
    concepts:
    - C076
    prompt: Return rate (%) for Electronics lines (returns ÷ sales lines)?
    answer: "{{ a.d2_p_return_elec }}"
    tolerance_abs: 0.2
    unit: '%'
    explanation: "Versus {{ a.d2_p_return }}% overall — conditioning changes the answer."
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C075
    prompt: "P(promo) = {{ a.d2_p_promo }}%, P(display) = {{ a.d2_p_display }}%, P(both) = {{ a.d2_p_both }}%. Are they independent?"
    options:
    - id: a
      text: "No — independence would give about {{ a.d2_p_both_if_indep }}%"
      correct: true
      why: P(A and B) ≠ P(A) × P(B).
    - id: b
      text: 'Yes'
      why: The joint is far above the product.
    - id: c
      text: Cannot tell without a test
      why: The gap is huge; a test would only confirm it.
    - id: d
      text: Only if P(both) = 0
      why: That would be mutually exclusive, not independent.
  - id: q3
    type: numeric
    difficulty: 3
    concepts:
    - C078
    prompt: "Using Bayes: sensitivity {{ a.d2_alert_sens_pct }}%, false-positive rate {{ a.d2_alert_fpr_pct }}%, base rate {{ a.d2_fraud_base_pct }}%. P(fraud | alert) in %?"
    answer: "{{ a.d2_alert_ppv_bayes_pct }}"
    tolerance_abs: 0.3
    unit: '%'
    explanation: 0.377×0.007 ÷ (0.377×0.007 + 0.031×0.993).
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C079
    prompt: Why is precision low even for a good fraud alert?
    options:
    - id: a
      text: Fraud is rare, so false alarms among the many genuine customers outnumber the frauds caught
      correct: true
      why: Base-rate effect.
    - id: b
      text: The alert is broken
      why: "It raises the fraud rate {{ a.d2_alert_lift }}-fold."
    - id: c
      text: Sensitivity is too high
      why: Not the cause.
    - id: d
      text: Sample size
      why: No.
  - id: q5
    type: tf_reason
    difficulty: 2
    concepts:
    - C076
    prompt: "True or false: since {{ a.d2_p_partner_given_default }}% of defaulters came through partners, a partner customer has a {{ a.d2_p_partner_given_default }}% chance of default."
    options:
    - id: a
      text: "False — that confuses P(partner | default) with P(default | partner) = {{ a.d2_pd_partner_pct }}%"
      correct: true
      why: Confusion of the inverse.
    - id: b
      text: 'True'
      why: Different conditionals.
    - id: c
      text: True for large samples
      why: Sample size doesn't fix it.
  - id: q6
    type: numeric
    difficulty: 2
    concepts:
    - C081
    prompt: "Odds of default for partner customers (p = {{ a.d2_pd_partner_pct }}%), 4 decimals?"
    answer: "{{ a.d2_odds_partner }}"
    tolerance_abs: 0.002
    explanation: p ÷ (1 − p).
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C077
    prompt: The law of total probability lets you…
    options:
    - id: a
      text: Combine group-level rates, weighted by group shares, into an overall rate
      correct: true
      why: P(A) = Σ P(A|Bᵢ)P(Bᵢ).
    - id: b
      text: Prove independence
      why: No.
    - id: c
      text: Reverse a conditional
      why: That's Bayes.
    - id: d
      text: Remove bias
      why: No.
  - id: q8
    type: numeric
    difficulty: 2
    concepts:
    - C080
    prompt: Per 10,000 accounts, how many false alarms does the alert produce?
    answer: "{{ a.d2_nf_false }}"
    tolerance_abs: 3
    explanation: "Versus {{ a.d2_nf_caught }} frauds caught."
- id: L2.1-L
  title: L2.1 Alerts and conditional claims (Leader)
  lesson: L2.1
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C078
    prompt: "The alert flags {{ a.d2_alert_rate_pct }}% of accounts with precision {{ a.d2_alert_ppv_bayes_pct }}%. Deploy?"
    options:
    - id: a
      text: As a triage queue if investigation cost per alert is below the expected recovery per alert; not as an automatic block
      correct: true
      why: Low precision is normal for rare events; economics decide.
    - id: b
      text: Block all alerted accounts
      why: Most are genuine customers.
    - id: c
      text: Reject — precision under 50%
      why: Wrong benchmark for rare events.
    - id: d
      text: Deploy without measuring
      why: No.
  - id: q2
    type: scenario
    difficulty: 2
    concepts:
    - C079
    prompt: A vendor claims 95% accuracy for fraud detection. First question?
    options:
    - id: a
      text: What precision and recall at our base rate, per 10,000 accounts?
      correct: true
      why: Accuracy is meaningless at 0.7% prevalence.
    - id: b
      text: What algorithm?
      why: Secondary.
    - id: c
      text: Price?
      why: Later.
    - id: d
      text: None
      why: See a.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C078
    prompt: Explain the alert's performance to the head of fraud in natural frequencies (two sentences).
    model: "Out of 10,000 accounts about {{ a.d2_nf_fraud }} are fraudulent; the alert catches about {{ a.d2_nf_caught }} of them but also flags about {{ a.d2_nf_false }} genuine customers. So roughly one alert in {{ (100 / a.d2_alert_ppv_bayes_pct) | round(0) | int }} is real fraud — useful for prioritising investigations, not for blocking."
    rubric: 'Full: three counts + conclusion on use. Partial: percentages only.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C076
    prompt: '''Most defaulters are partner customers'' is used to argue ''partner customers mostly default''. Your correction?'
    options:
    - id: a
      text: "Partner default rate is {{ a.d2_pd_partner_pct }}% — high but far from 'mostly'"
      correct: true
      why: Swapped conditional.
    - id: b
      text: Agree
      why: Wrong.
    - id: c
      text: Partner customers never default
      why: Wrong.
    - id: d
      text: Can't be computed
      why: It can.
  - id: q5
    type: scenario
    difficulty: 3
    concepts:
    - C075
    prompt: Merchandising wants separate ROI for displays and promotions from historical data. Response?
    options:
    - id: a
      text: "They co-occur {{ a.d2_p_disp_given_promo }}% of the time — effects are not separable without a test varying them independently"
      correct: true
      why: Dependence/confounding.
    - id: b
      text: Run a regression with both
      why: Near-collinear; unstable.
    - id: c
      text: Assume equal split
      why: Arbitrary.
    - id: d
      text: Use the bigger effect
      why: No.
- id: L2.2-F
  title: L2.2 Discrete distributions (Basic → Advanced)
  lesson: L2.2
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C083
    prompt: Number of defaults among 2,400 accounts with the same PD follows…
    options:
    - id: a
      text: Binomial
      correct: true
      why: Successes in n independent trials.
    - id: b
      text: Poisson only
      why: Approximation at best.
    - id: c
      text: Normal exactly
      why: Approximation.
    - id: d
      text: Geometric
      why: Trials until first success.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C083
    prompt: "Expected defaults and SD for n = 2,400 at p = {{ a.d2_true_default_pct }}%: give the SD."
    answer: "{{ a.d2_binom_sd }}"
    tolerance_abs: 0.2
    explanation: "√(np(1−p)); mean {{ a.d2_binom_mean }}."
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C085
    prompt: Variance ÷ mean of weekly Dairy units in store S001?
    answer: "{{ a.d2_s1_dairy_disp }}"
    tolerance_abs: 0.1
    explanation: Over-dispersed → negative binomial.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C086
    prompt: When is Poisson appropriate for counts?
    options:
    - id: a
      text: When variance ≈ mean and events are independent at a constant rate
      correct: true
      why: Poisson's defining property.
    - id: b
      text: Always for counts
      why: Retail demand is usually over-dispersed.
    - id: c
      text: When counts are large
      why: Not the criterion.
    - id: d
      text: When there are zeros
      why: No.
  - id: q5
    type: numeric
    difficulty: 3
    concepts:
    - C087
    prompt: Audit samples 50 of 200 files with 10 faulty. P(at least one faulty found), % (hypergeometric)?
    answer: "{{ a.d2_hyp_p_detect }}"
    tolerance_abs: 0.2
    unit: '%'
    explanation: "Binomial approximation gives {{ a.d2_binom_p_detect }}%."
  - id: q6
    type: numeric
    difficulty: 2
    concepts:
    - C084
    prompt: "With {{ a.d2_p_promo_basket }}% of baskets containing a promo item, expected baskets until the first promo basket?"
    answer: "{{ a.d2_geom_mean_wait }}"
    tolerance_abs: 0.05
    explanation: Geometric mean 1/p.
  - id: q7
    type: mcq
    difficulty: 3
    concepts:
    - C086
    prompt: "Poisson fits the zero-claim share well but predicts {{ a.d2_claim_p2_pois }}% of policies with 2+ claims vs {{ a.d2_claim_p2_obs }}% observed. Implication?"
    options:
    - id: a
      text: Risk varies between policyholders; use negative binomial
      correct: true
      why: Heterogeneity fattens the tail.
    - id: b
      text: Poisson is fine
      why: It misses the expensive tail.
    - id: c
      text: Data error
      why: No.
    - id: d
      text: Use a normal
      why: Counts.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C089
    prompt: Store return rates vary more than binomial noise predicts. Which model idea fits?
    options:
    - id: a
      text: Beta-binomial / hierarchical (rates differ by store)
      correct: true
      why: Extra between-group variation.
    - id: b
      text: Single binomial
      why: Too little variance.
    - id: c
      text: Geometric
      why: No.
    - id: d
      text: Uniform
      why: No.
- id: L2.2-L
  title: L2.2 Distributions in decisions (Leader)
  lesson: L2.2
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C085
    prompt: "Safety stock was set assuming Poisson demand; actual dispersion is ~{{ a.d2_sku_disp_median }} for typical SKUs. Consequence?"
    options:
    - id: a
      text: Systematic under-stocking and more stockouts than planned
      correct: true
      why: Poisson understates variability.
    - id: b
      text: Over-stocking
      why: Opposite.
    - id: c
      text: No effect
      why: Variance drives safety stock.
    - id: d
      text: Only affects slow movers
      why: All over-dispersed SKUs.
  - id: q2
    type: scenario
    difficulty: 3
    concepts:
    - C083
    prompt: "Vintage defaults are consistent with one PD before 2025Q2 (p = {{ a.d2_vint_early_chi2_p }}) but not overall (p ≈ {{ a.d2_vint_chi2_p }}). Decision for provisioning?"
    options:
    - id: a
      text: Segment PD — recent vintages need their own estimate and an investigation
      correct: true
      why: The process changed.
    - id: b
      text: Keep one PD
      why: Under-provisions recent business.
    - id: c
      text: Average all vintages
      why: Hides the change.
    - id: d
      text: Ignore — chance
      why: p ≈ 0.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C087
    prompt: Audit plans to sample 50 of 200 files 'as usual'. What do you ask, and how should the size be set?
    model: "Ask what error rate audit must detect and with what confidence. Size with the hypergeometric: for 10 faulty in 200, 50 files give {{ a.d2_hyp_p_detect }}% detection; {{ a.d2_hyp_n_for_95 }} files give 95%. Smaller error counts need much larger samples."
    rubric: 'Full: detection target + hypergeometric sizing. Partial: one of them.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C086
    prompt: Pricing uses Poisson claim frequency because the mean matches. What do you check?
    options:
    - id: a
      text: Dispersion and the share of multi-claim policies
      correct: true
      why: Tail drives cost.
    - id: b
      text: The mean again
      why: Already matches.
    - id: c
      text: Only zeros
      why: Insufficient.
    - id: d
      text: Nothing
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C085
    prompt: Quickest test of whether a count model is plausible?
    options:
    - id: a
      text: Variance-to-mean ratio
      correct: true
      why: Seconds to compute; decides Poisson vs NB.
    - id: b
      text: R²
      why: No.
    - id: c
      text: Skewness of a different variable
      why: No.
    - id: d
      text: AUC
      why: No.
- id: L2.3-F
  title: L2.3 Continuous distributions (Basic → Advanced)
  lesson: L2.3
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 2
    concepts:
    - C092
    prompt: Which family fits basket value best by AIC?
    options:
    - id: a
      text: "{{ a.d2_basket_best }}"
      correct: true
      why: "AIC {{ a.d2_basket_aic[a.d2_basket_best] | n }}."
    - id: b
      text: normal
      why: Worst — data are positive and skewed.
    - id: c
      text: uniform
      why: Not a candidate.
    - id: d
      text: Cauchy
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C104
    prompt: ΔAIC between two fits is 1.5. Interpretation?
    options:
    - id: a
      text: Practically tied — choose the simpler or more interpretable
      correct: true
      why: ΔAIC < 2.
    - id: b
      text: Decisive
      why: Needs > 10.
    - id: c
      text: Lower one is wrong
      why: No.
    - id: d
      text: Use a p-value instead
      why: No.
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C095
    prompt: Weibull shape k for gaps between a customer's baskets?
    answer: "{{ a.d2_gap_weibull_k }}"
    tolerance_abs: 0.05
    explanation: k ≈ 1 → close to exponential (constant hazard).
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C094
    prompt: "Fitted gamma P99 severity {{ a.d2_sev_p99_gamma | n }}, empirical P99 {{ a.d2_sev_p99_emp | n }}. Meaning?"
    options:
    - id: a
      text: The model under-states the tail — treat large losses separately
      correct: true
      why: Catastrophic claims.
    - id: b
      text: Fit is perfect
      why: Tail gap.
    - id: c
      text: Use a normal
      why: Worse.
    - id: d
      text: Delete large claims
      why: They are real costs.
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C090
    prompt: '% of bureau scores within 1 SD of the mean?'
    answer: "{{ a.d2_bureau_within1sd_pct }}"
    tolerance_abs: 0.3
    unit: '%'
    explanation: Close to the normal's 68%.
  - id: q6
    type: mcq
    difficulty: 3
    concepts:
    - C098
    prompt: Why does the running mean of Cauchy draws never settle?
    options:
    - id: a
      text: The Cauchy distribution has no mean — tails are too heavy
      correct: true
      why: LLN requires a finite mean.
    - id: b
      text: Too few draws
      why: More draws don't help.
    - id: c
      text: Random seed
      why: No.
    - id: d
      text: Rounding
      why: No.
  - id: q7
    type: numeric
    difficulty: 2
    concepts:
    - C101
    prompt: Two-sided 95% t critical value with 5 degrees of freedom?
    answer: "{{ a.d2_t_crit_df5 }}"
    tolerance_abs: 0.01
    explanation: "Versus {{ a.d2_z_crit }} for the normal — heavier tails at small n."
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C099
    prompt: Weekly price changes have a sharp peak and fat tails. Better than normal?
    options:
    - id: a
      text: Laplace
      correct: true
      why: AIC far lower.
    - id: b
      text: Uniform
      why: No.
    - id: c
      text: Beta
      why: Bounded 0–1.
    - id: d
      text: Exponential
      why: Positive only.
- id: L2.3-L
  title: L2.3 Tails and risk (Leader)
  lesson: L2.3
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C094
    prompt: Pricing fitted a gamma to attritional claims and excluded three catastrophic ones without noting it. Concern?
    options:
    - id: a
      text: Premiums ignore large-loss cost; require an explicit large-loss model or loading
      correct: true
      why: "Mean severity rises from {{ a.d2_sev_mean_nocat | n }} to {{ a.d2_sev_mean_all | n }} with them."
    - id: b
      text: Fine — outliers
      why: They are real costs.
    - id: c
      text: Use median severity
      why: Worse.
    - id: d
      text: No concern
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C104
    prompt: Which single check do you demand on any fitted distribution used for risk?
    options:
    - id: a
      text: Fitted vs empirical high quantiles (P99)
      correct: true
      why: The tail drives reserves and limits.
    - id: b
      text: AIC only
      why: Can hide tail misfit.
    - id: c
      text: Mean only
      why: No.
    - id: d
      text: Colour of the plot
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C103
    prompt: A junior assumes normally distributed losses for a stress scenario. What do you ask for?
    model: Evidence on the shape (Q-Q, tail quantiles), a fat-tailed alternative (t, Laplace, lognormal/gamma with a large-loss component), and stress results under both. Normal tails usually understate extreme losses.
    rubric: 'Full: evidence + alternative + comparison. Partial: one element.'
  - id: q4
    type: scenario
    difficulty: 2
    concepts:
    - C095
    prompt: Churn time has Weibull k < 1. Operational implication?
    options:
    - id: a
      text: Risk is highest early in the relationship — invest in onboarding
      correct: true
      why: Decreasing hazard.
    - id: b
      text: Risk rises with tenure
      why: That's k > 1.
    - id: c
      text: Constant risk
      why: k = 1.
    - id: d
      text: None
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C101
    prompt: Why use t rather than z critical values with small samples?
    options:
    - id: a
      text: The SD is estimated, adding uncertainty; t has heavier tails
      correct: true
      why: "{{ a.d2_t_crit_df5 }} vs {{ a.d2_z_crit }} at df 5."
    - id: b
      text: t is more precise
      why: It is more honest, not more precise.
    - id: c
      text: Convention only
      why: No.
    - id: d
      text: No difference
      why: There is at small n.
- id: L2.4-F
  title: L2.4 Sampling and bias (Basic → Advanced)
  lesson: L2.4
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 2
    concepts:
    - C070
    prompt: "Promo lines show {{ a.d2_simpson_overall_pct }}% units per line overall but more within every format. This is…"
    options:
    - id: a
      text: Simpson's paradox caused by format mix
      correct: true
      why: Promos concentrated in Express.
    - id: b
      text: A data error
      why: No.
    - id: c
      text: Random noise
      why: Systematic.
    - id: d
      text: Survivorship bias
      why: Different bias.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C068
    prompt: True Snacks category growth (%) including delisted SKUs?
    answer: "{{ a.d2_surv_true_pct }}"
    tolerance_abs: 0.5
    unit: '%'
    explanation: "Versus {{ a.d2_surv_current_pct }}% using the current range."
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C067
    prompt: "Default rate from branch-acquired accounts only is {{ a.d2_branch_only_pct }}% vs {{ a.d2_true_default_pct }}% overall. Bias?"
    options:
    - id: a
      text: Convenience/selection bias — riskier partner customers excluded
      correct: true
      why: Sampling frame differs.
    - id: b
      text: Random error
      why: Systematic.
    - id: c
      text: No bias
      why: No.
    - id: d
      text: Non-response
      why: Not quite.
  - id: q4
    type: tf_reason
    difficulty: 2
    concepts:
    - C063
    prompt: 'True or false: a bigger sample removes bias.'
    options:
    - id: a
      text: False — bias is systematic; more data from the same biased frame gives a more precise wrong answer
      correct: true
      why: Only sampling error shrinks.
    - id: b
      text: 'True'
      why: No.
    - id: c
      text: True, beyond 10,000 rows
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C065
    prompt: "Stratifying by channel barely reduced the SE ({{ a.d2_srs_se_pp }} → {{ a.d2_strat_se_pp }} pp). Why?"
    options:
    - id: a
      text: Most variation in default is within channels
      correct: true
      why: Gains depend on between-strata differences relative to within.
    - id: b
      text: Stratification is broken
      why: No.
    - id: c
      text: Wrong weights
      why: Weights were correct.
    - id: d
      text: Too many samples
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C071
    prompt: "Displays accompany {{ a.d2_disp_promo_pct }}% of promo lines. For the promo effect, display is a…"
    options:
    - id: a
      text: Confounder
      correct: true
      why: Related to treatment and outcome.
    - id: b
      text: Mediator
      why: A mediator lies on the path from promotion to sales; displays are assigned alongside promotions, not caused by them.
    - id: c
      text: Instrument
      why: No.
    - id: d
      text: Irrelevant
      why: No.
  - id: q7
    type: mcq
    difficulty: 3
    concepts:
    - C067
    prompt: Why can't booked-account data tell you the default rate below the old approval cut-off?
    options:
    - id: a
      text: No one below the cut-off was approved, so their outcomes were never observed
      correct: true
      why: Selection on the outcome-relevant score.
    - id: b
      text: Not enough accounts
      why: There are zero.
    - id: c
      text: Data error
      why: No.
    - id: d
      text: It can
      why: No.
  - id: q8
    type: multi
    difficulty: 2
    concepts:
    - C067
    - C068
    - C069
    prompt: Which are examples of bias from who is in the data? (Select all.)
    options:
    - id: a
      text: Current product master only
      correct: true
      why: Survivorship.
    - id: b
      text: Loyalty members chose to join
      correct: true
