quizzes:
- id: L5.1-F
  title: L5.1 Linear regression (Basic → Advanced)
  lesson: L5.1
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C166
    prompt: A multiple-regression coefficient is…
    options:
    - id: a
      text: The expected change in y per unit of x, holding the other predictors fixed
      correct: true
      why: Adjusted association.
    - id: b
      text: The correlation of x and y
      why: No.
    - id: c
      text: A causal effect
      why: Only with a design.
    - id: d
      text: The share of variance explained
      why: That's R².
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C167
    prompt: "Temperature coefficient in the log-units model is {{ a.d5_bev_temp_b }}. % change per +1 °C?"
    answer: "{{ a.d5_bev_temp_pct }}"
    tolerance_abs: 0.1
    unit: '%'
    explanation: 100 × (e^β − 1).
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C167
    prompt: "Promo-share coefficient {{ a.d5_bev_promo_b }}. % change for +10 pp of SKUs on promotion?"
    answer: "{{ a.d5_bev_promo10_pct }}"
    tolerance_abs: 0.3
    unit: '%'
    explanation: 100 × (e^(0.1β) − 1).
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C167
    prompt: In log(y) ~ log(x), β is…
    options:
    - id: a
      text: An elasticity (% change in y per 1% change in x)
      correct: true
      why: Log–log.
    - id: b
      text: Units per unit
      why: That's linear.
    - id: c
      text: '% per unit'
      why: That's log–linear.
    - id: d
      text: An odds ratio
      why: Logistic.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C169
    prompt: 'C(format) with Express as reference: the Hyper coefficient means…'
    options:
    - id: a
      text: Difference between Hyper and Express, other things equal
      correct: true
      why: Vs reference.
    - id: b
      text: Hyper's mean
      why: No.
    - id: c
      text: Difference from the average store
      why: Not with treatment coding.
    - id: d
      text: Hyper's share
      why: No.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C168
    prompt: "R² = {{ a.d5_bev_r2 }}. Which is true?"
    options:
    - id: a
      text: Most variation is explained, largely by store size; it doesn't prove the coefficients are right
      correct: true
      why: Fit ≠ validity.
    - id: b
      text: The model is causal
      why: No.
    - id: c
      text: 89% of predictions are exact
      why: No.
    - id: d
      text: Adding variables can lower R²
      why: R² never falls when adding.
  - id: q7
    type: numeric
    difficulty: 2
    concepts:
    - C167
    prompt: Elasticity of credit limit with respect to income?
    answer: "{{ a.d5_lim_elast }}"
    tolerance_abs: 0.02
    explanation: Limits ∝ income — a policy rule.
  - id: q8
    type: mcq
    difficulty: 3
    concepts:
    - C167
    prompt: Why prefer the log model to the raw-units model across stores?
    options:
    - id: a
      text: Effects are proportional and comparable across store sizes
      correct: true
      why: Raw effects average over very different stores.
    - id: b
      text: Higher R²
      why: Not necessarily.
    - id: c
      text: No assumptions
      why: No.
    - id: d
      text: Always unbiased
      why: No.
- id: L5.1-L
  title: L5.1 Reading regressions (Leader)
  lesson: L5.1
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts:
    - C167
    prompt: Which presentation of the Beverages model is most useful to the buyer?
    options:
    - id: a
      text: '''+2% per °C, +45% holiday weeks, −9% per 10 pp of SKUs out of stock'', with CIs'
      correct: true
      why: Business units.
    - id: b
      text: A table of β and p
      why: Not actionable.
    - id: c
      text: R² only
      why: No.
    - id: d
      text: The SQL
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C166
    prompt: '''Holding promotions constant'' is credible only if…'
    options:
    - id: a
      text: The model includes the variables that move with promotions (displays, format) as the DAG requires
      correct: true
      why: L4.4.
    - id: b
      text: R² is high
      why: No.
    - id: c
      text: n is large
      why: No.
    - id: d
      text: Always
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C167
    prompt: A deck claims 'the regression discovered that bureau score drives our interest rates'. Comment.
    model: "That is our pricing rule ({{ a.d5_rate_bureau_100 }} pp per 100 points), not a discovery about customers. Regressions on policy-determined variables recover the policy. Useful for auditing pricing consistency, not as an insight."
    rubric: 'Full: policy recovered + appropriate use. Partial: one.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C168
    prompt: A model with R² 0.15 from an A/B test…
    options:
    - id: a
      text: Can still estimate the causal effect precisely
      correct: true
      why: R² ≠ validity.
    - id: b
      text: Is useless
      why: No.
    - id: c
      text: Must be redone
      why: No.
    - id: d
      text: Is overfitted
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C167
    prompt: First question when shown a coefficient?
    options:
    - id: a
      text: What does it mean in business units, with what interval?
      correct: true
      why: Translate first.
    - id: b
      text: Is p < 0.05?
      why: Secondary.
    - id: c
      text: Which software?
      why: No.
    - id: d
      text: How many decimals?
      why: No.
- id: L5.2-F
  title: L5.2 Diagnostics (Basic → Advanced)
  lesson: L5.2
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 2
    concepts:
    - C171
    prompt: Heteroscedasticity mainly affects…
    options:
    - id: a
      text: Standard errors (not coefficients)
      correct: true
      why: Use robust SEs.
    - id: b
      text: Coefficients only
      why: No.
    - id: c
      text: R² only
      why: No.
    - id: d
      text: Nothing
      why: SEs wrong.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C171
    prompt: Raw-units residuals fan out with store size. Best fix?
    options:
    - id: a
      text: Log the outcome and use HC3 SEs
      correct: true
      why: Proportional effects, robust SEs.
    - id: b
      text: Drop big stores
      why: No.
    - id: c
      text: Ignore
      why: No.
    - id: d
      text: Add more variables
      why: Doesn't fix variance.
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C172
    prompt: VIF of income in the card default model?
    answer: "{{ a.d5_vif.income_annual }}"
    tolerance_abs: 3
    explanation: Collinear with limit.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C172
    prompt: With VIF ≈ 140, the income and limit coefficients are…
    options:
    - id: a
      text: Individually uninterpretable and unstable
      correct: true
      why: Signs flip across samples.
    - id: b
      text: Precise
      why: No.
    - id: c
      text: Causal
      why: No.
    - id: d
      text: Biased predictions
      why: Predictions are fine.
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C172
    prompt: In how many of 5 samples was the income coefficient positive?
    answer: "{{ a.d5_flip_n_inc_pos }}"
    tolerance_abs: 0
    explanation: Instability.
  - id: q6
    type: mcq
    difficulty: 2
    concepts:
    - C173
    prompt: Cook's distance measures…
    options:
    - id: a
      text: How much the fit changes if a row is removed
      correct: true
      why: Influence.
    - id: b
      text: Residual size
      why: Partly.
    - id: c
      text: Leverage only
      why: Combined.
    - id: d
      text: Correlation
      why: No.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C170
    prompt: Which assumption violation is most dangerous for p-values?
    options:
    - id: a
      text: Non-independent errors
      correct: true
      why: SEs far too small.
    - id: b
      text: Non-normal errors with large n
      why: Minor.
    - id: c
      text: Slight heteroscedasticity
      why: Fixable with HC3.
    - id: d
      text: Rounded data
      why: No.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C174
    prompt: Durbin-Watson near 0 on weekly data means…
    options:
    - id: a
      text: Strong positive autocorrelation — SEs over-optimistic
      correct: true
      why: Time dependence.
    - id: b
      text: No autocorrelation
      why: That's ≈ 2.
    - id: c
      text: Negative autocorrelation
      why: Near 4.
    - id: d
      text: Perfect fit
      why: No.
- id: L5.2-L
  title: L5.2 Reviewing models (Leader)
  lesson: L5.2
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 3
    concepts:
    - C172
    prompt: Version 2 of the default model says income increases risk; version 1 said the opposite. Response?
    options:
    - id: a
      text: Check VIF — income and limit are near-duplicates; keep one
      correct: true
      why: Collinearity.
    - id: b
      text: Investigate rich customers
      why: Artefact.
    - id: c
      text: Average versions
      why: No.
    - id: d
      text: Ignore
      why: Explainability risk.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C173
    prompt: A junior removed 181 'influential' rows. You ask…
    options:
    - id: a
      text: Which rows, why, and does the conclusion change with them in?
      correct: true
      why: Document and justify.
    - id: b
      text: Remove more
      why: No.
    - id: c
      text: Fine
      why: No.
    - id: d
      text: Use median
      why: Not the point.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C171
    prompt: Write a team standard for regression diagnostics (3 bullets).
    model: 1) Plot residuals vs fitted and Q-Q; transform if curved or fan-shaped. 2) Default to robust (HC3) or cluster SEs at the unit of dependence. 3) Report VIFs for interpreted terms (> 5 → drop/combine/regularise) and list influential rows with explanations — never auto-delete.
    rubric: 'Full: plots + robust SEs + VIF/influence. Partial: 2.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C172
    prompt: Collinearity matters most for…
    options:
    - id: a
      text: Interpretation and adverse-action reasons
      correct: true
      why: Predictions unaffected.
    - id: b
      text: Prediction accuracy
      why: Little effect.
    - id: c
      text: Data storage
      why: No.
    - id: d
      text: Nothing
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C174
    prompt: Weekly store data, p < 0.001 everywhere. First concern?
    options:
    - id: a
      text: Repeated rows per store — cluster SEs
      correct: true
      why: Dependence.
    - id: b
      text: Too few rows
      why: No.
    - id: c
      text: Software bug
      why: Unlikely.
    - id: d
      text: None
      why: No.
- id: L5.3-F
  title: L5.3 Logistic regression (Basic → Advanced)
  lesson: L5.3
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C175
    prompt: Logistic regression is linear on the scale of…
    options:
    - id: a
      text: Log-odds
      correct: true
      why: logit(p).
    - id: b
      text: Probability
      why: No — S-shaped.
    - id: c
      text: Odds
      why: Log of odds.
    - id: d
      text: Counts
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C175
    prompt: Odds ratio for +50 bureau points?
    answer: "{{ a.d5_or_bureau }}"
    tolerance_abs: 0.02
    explanation: Protective.
  - id: q3
    type: numeric
    difficulty: 2
    concepts:
    - C175
    prompt: Average marginal effect of the partner channel on PD (pp)?
    answer: "{{ a.d5_me_partner_pp }}"
    tolerance_abs: 0.3
    explanation: "OR {{ a.d5_or_partner }}."
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C175
    prompt: OR ≈ RR when…
    options:
    - id: a
      text: The outcome is rare
      correct: true
      why: Odds ≈ probability.
    - id: b
      text: n is large
      why: No.
    - id: c
      text: The OR is significant
      why: No.
    - id: d
      text: Always
      why: No.
  - id: q5
    type: numeric
    difficulty: 2
    concepts:
    - C176
    prompt: AUC of the default model?
    answer: "{{ a.d5_logit_auc }}"
    tolerance_abs: 0.01
    explanation: Good ranking.
  - id: q6
    type: mcq
    difficulty: 3
    concepts:
    - C176
    prompt: "Return model: significant drivers, AUC {{ a.d5_ret_auc }}. Meaning?"
    options:
    - id: a
      text: Real associations, weak prediction
      correct: true
      why: Near-random ranking.
    - id: b
      text: Good model
      why: No.
    - id: c
      text: Bug
      why: No.
    - id: d
      text: Overfitted
      why: No.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C176
    prompt: McFadden pseudo-R² of 0.18 is…
    options:
    - id: a
      text: Reasonable for a logistic model; not comparable with OLS R²
      correct: true
      why: 0.2–0.4 good.
    - id: b
      text: Very poor
      why: Different scale.
    - id: c
      text: 18% accuracy
      why: No.
    - id: d
      text: Overfitting
      why: No.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C176
    prompt: Best check that predicted PDs are right in level?
    options:
    - id: a
      text: Calibration plot by decile
      correct: true
      why: Predicted vs observed.
    - id: b
      text: AUC
      why: Ranking only.
    - id: c
      text: p-values
      why: No.
    - id: d
      text: R²
      why: No.
- id: L5.3-L
  title: L5.3 Communicating logistic results (Leader)
  lesson: L5.3
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts:
    - C175
    prompt: Which sentence for the CRO?
    options:
    - id: a
      text: "'A partner-channel customer's PD is ~{{ a.d5_me_partner_pp }} pp higher than a similar branch customer's'"
      correct: true
      why: pp, adjusted.
    - id: b
      text: '''Partner customers are 2.5× more likely to default'''
      why: Odds, not probability; overstated.
    - id: c
      text: '''β = 0.9'''
      why: Opaque.
    - id: d
      text: '''Significant'''
      why: Uninformative.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C176
    prompt: A significant model is proposed for deployment. You require…
    options:
    - id: a
      text: Held-out AUC and calibration
      correct: true
      why: Predictive validation.
    - id: b
      text: Smaller p-values
      why: No.
    - id: c
      text: More variables
      why: No.
    - id: d
      text: Nothing
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C175
    prompt: Why are logistic scorecards still standard in credit despite ML?
    model: Stable, monotone and explainable coefficients (adverse-action reasons), easy calibration and monitoring, regulator familiarity, and only modest accuracy loss vs GBMs on well-engineered features.
    rubric: 'Full: explainability + stability/calibration + regulation. Partial: 1–2.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C175
    prompt: "Unverified-income OR is {{ a.d5_or_unver }} adjusted vs a raw RR of ~1.9 (L3.4). Why smaller?"
    options:
    - id: a
      text: Part of the raw gap is explained by channel and bureau score
      correct: true
      why: Confounding adjusted.
    - id: b
      text: Error
      why: No.
    - id: c
      text: OR always smaller
      why: No.
    - id: d
      text: Sample size
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C176
    prompt: Event rate matters for interpreting logistic output because…
    options:
    - id: a
      text: It converts odds into probabilities and determines whether OR ≈ RR
      correct: true
      why: Base rate.
    - id: b
      text: It sets R²
      why: No.
    - id: c
      text: It doesn't
      why: It does.
    - id: d
      text: It fixes calibration
      why: No.
- id: L5.4-F
  title: L5.4 Regularisation (Basic → Advanced)
  lesson: L5.4
  track: F
  questions:
  - id: q1
    type: mcq
    difficulty: 1
    concepts:
    - C178
    prompt: Lasso differs from ridge because it…
    options:
    - id: a
      text: Can set coefficients exactly to zero
      correct: true
      why: L1 penalty.
    - id: b
      text: Never shrinks
      why: No.
    - id: c
      text: Needs no tuning
      why: No.
    - id: d
      text: Is unbiased
      why: No.
  - id: q2
    type: numeric
    difficulty: 2
    concepts:
    - C179
    prompt: Test R² of OLS trained on 80 rows with 59 features?
    answer: "{{ a.d5_r2_ols8_te }}"
    tolerance_abs: 0.05
    explanation: "Train {{ a.d5_r2_ols8_tr }}."
  - id: q3
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: With thousands of rows per feature, regularisation…
    options:
    - id: a
      text: Changes little
      correct: true
      why: "OLS {{ a.d5_r2_ols_te }} ≈ lasso {{ a.d5_r2_lasso_te }}."
    - id: b
      text: Always improves test error
      why: No.
    - id: c
      text: Is harmful
      why: No.
    - id: d
      text: Removes bias
      why: Adds bias.
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: Why shuffle CV folds on store-sorted data?
    options:
    - id: a
      text: Unshuffled folds drop whole stores and mislead the choice of λ
      correct: true
      why: Fold composition.
    - id: b
      text: Speed
      why: No.
    - id: c
      text: Never shuffle
      why: Except time series.
    - id: d
      text: To raise R²
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: The 1-SE rule picks…
    options:
    - id: a
      text: The simplest model within one SE of the best CV score
      correct: true
      why: Parsimony.
    - id: b
      text: The best CV score
      why: That's 'min'.
    - id: c
      text: The largest model
      why: No.
    - id: d
      text: A random model
      why: No.
  - id: q6
    type: numeric
    difficulty: 2
    concepts:
    - C178
    prompt: Noise features kept by the best-CV lasso in the finance screen?
    answer: "{{ a.d5_f_l1best_noise_kept }}"
    tolerance_abs: 1
    explanation: Of 20.
  - id: q7
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: BIC penalises parameters…
    options:
    - id: a
      text: More than AIC (log n each)
      correct: true
      why: Prefers smaller models.
    - id: b
      text: Less than AIC
      why: No.
    - id: c
      text: Not at all
      why: No.
    - id: d
      text: Only for logistic
      why: No.
  - id: q8
    type: mcq
    difficulty: 2
    concepts:
    - C177
    prompt: Ridge suits correlated predictors because it…
    options:
    - id: a
      text: Shares the effect between them stably
      correct: true
      why: L2.
    - id: b
      text: Drops one at random
      why: Lasso tends to.
    - id: c
      text: Ignores them
      why: No.
    - id: d
      text: Needs no scaling
      why: Scale first.
- id: L5.4-L
  title: L5.4 Parsimony and validation (Leader)
  lesson: L5.4
  track: L
  questions:
  - id: q1
    type: scenario
    difficulty: 2
    concepts:
    - C179
    prompt: A junior shows R² 0.99 on training data. Your question?
    options:
    - id: a
      text: What is it on held-out (and out-of-time) data?
      correct: true
      why: Overfitting check.
    - id: b
      text: Can it reach 1.0?
      why: No.
    - id: c
      text: Which features?
      why: Later.
    - id: d
      text: None
      why: No.
  - id: q2
    type: mcq
    difficulty: 2
    concepts:
    - C178
    prompt: '''Lasso dropped income, so income doesn''t matter.'' Response?'
    options:
    - id: a
      text: It may have kept a correlated substitute (limit); selection isn't causal
      correct: true
      why: F06.
    - id: b
      text: Agree
      why: No.
    - id: c
      text: Use ridge to prove it
      why: No.
    - id: d
      text: Remove limit too
      why: No.
  - id: q3
    type: open
    difficulty: 3
    concepts:
    - C179
    prompt: Argue for the 1-SE model to a product owner who wants maximum AUC.
    model: "It loses ~{{ ((a.d5_f_auc_l1best_te - a.d5_f_auc_l1_te) * 1000) | round(0) | int }} thousandths of AUC on held-out data but uses {{ a.d5_f_l1_kept }} instead of {{ a.d5_f_l1best_kept }} variables: cheaper data, simpler monitoring and explanations, less drift risk. The AUC difference is within noise."
    rubric: 'Full: numbers + operational benefits. Partial: benefits only.'
  - id: q4
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: Which validation do you require for a model used over time?
    options:
    - id: a
      text: Out-of-time holdout
      correct: true
      why: Time drift.
    - id: b
      text: Random split only
      why: Optimistic.
    - id: c
      text: Training fit
      why: No.
    - id: d
      text: None
      why: No.
  - id: q5
    type: mcq
    difficulty: 2
    concepts:
    - C179
    prompt: ΔAIC = 3 between models on 25,000 rows. Meaning?
    options:
    - id: a
      text: Small; check out-of-sample before choosing the bigger model
      correct: true
