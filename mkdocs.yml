site_name: Statistics for Data Science Bootcamp
site_description: Learn statistics, machine learning and AI by solving real retail and banking problems — two learning paths, no coding taught.
site_author: Softsensor AI
repo_name: stats-bootcamp
copyright: '© 2026 Kumar Anubhav · <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> — free to share and adapt with credit, not for commercial use'
# repo_url: https://github.com/<org>/stats-bootcamp   # set when you push
docs_dir: docs
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.tabs.link        # Basic → Advanced / Leader tabs stay in sync across all pages
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    logo: material/chart-bell-curve
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: sbm
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - assets/css/extra.css
  - assets/css/theme.css
extra_javascript:
  - assets/vendor/mermaid.min.js
  - assets/js/common.js
  - assets/js/diagrams.js
  - assets/js/path.js
  - assets/js/charts.js
  - assets/js/ui.js
  - assets/js/quiz.js
  - assets/js/navigator.js
  - assets/js/hunt.js
  - assets/js/progress.js
  - assets/js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
