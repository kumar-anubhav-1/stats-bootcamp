# L8.6 (F08): monthly maximum cash deposit — bunching just below the 10,000 reporting threshold.
recipe: rcp_anomaly_scan
dataset: {name: meridian_performance_monthly, path: data/finance/performance_monthly.parquet}
columns: {value: cash_deposit_max}
filters: []
params: {mode: bunching, threshold: 10000, band: 0.1}
output: {folder: "outputs/{recipe}/{date}_finance_structuring"}
