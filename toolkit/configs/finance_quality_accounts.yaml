# L1.2 / L1.3 reuse: same recipe on the bank accounts (config only)
recipe: rcp_quality
dataset:
  name: meridian_accounts
  path: data/finance/accounts.parquet
  grain: account
columns:
  id: account_id
  target: default_12m
filters: []
params:
  rules:
    - {name: impossible_age, flag: "(age < 18) | (age >= 120)", severity: error, why: "Outside the legal and plausible range"}
    - {name: negative_income, flag: "income_annual < 0", severity: error, why: "Income cannot be negative"}
    - {name: utilisation_over_100pct, flag: "utilisation > 1", severity: warning, why: "Over-limit balances happen but should be rare"}
    - {name: dti_over_1, flag: "dti > 1", severity: warning, why: "Debt above annual income"}
  missing_by: [employment_type, acquisition_channel, income_verified_flag, product_type, bureau_score]
  write_clean: false
output:
  folder: outputs/{recipe}/{date}_{dataset}
