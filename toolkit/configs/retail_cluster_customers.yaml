# L8.1: customer segments from transaction lines (customers with ≥ 2 baskets).
recipe: rcp_cluster
dataset: {name: northstar_transactions, path: data/retail/transactions.parquet}
columns: {entity: customer_id}
filters: ["return_flag == False", "quantity > 0", "unit_price / list_price < 20"]
params:
  drop_duplicates: [line_id]
  aggregate: {baskets: [basket_id, nunique], revenue: [revenue, sum], promo_share: [promo_flag, mean], avg_list_price: [list_price, median]}
  share_of: category
  log: [baskets, revenue]
  min_rows: 4
  k_range: [2, 8]
  k: 5
output: {folder: "outputs/{recipe}/{date}_retail_cluster_customers"}
