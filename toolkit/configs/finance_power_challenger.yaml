# L3.6: accounts needed for a collections challenger with an 80/20 split (champion:challenger).
recipe: rcp_power
dataset: {name: meridian_accounts, path: data/finance/accounts.parquet}
columns: {target: cured_within_3m, group: strategy_group}
filters:
  - "strategy_group != 'none'"
params:
  design: proportions
  control_label: champion
  effects: [0.02, 0.03, 0.05, 0.08]
  ratio: 0.25
  alpha: 0.05
  power: 0.8
  n_available: 3335
output: {folder: "outputs/{recipe}/{date}_finance_power_challenger"}
