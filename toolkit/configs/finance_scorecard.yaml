# L8.7: application scorecard — WoE/IV, points (600 at 50:1, PDO 20), Gini/KS, bad rate by vintage.
recipe: rcp_scorecard
dataset: {name: meridian_accounts, path: data/finance/accounts.parquet}
columns: {target: default_12m, features: [bureau_score, utilisation, income_annual, acquisition_channel, dti, inquiries_6m, age, tenure_months_with_bank], vintage: vintage}
filters: []
params:
  bins: {bureau_score: [600, 650, 700, 750], utilisation: [0.5, 0.7, 0.8, 0.9], income_annual: 4, dti: [0.2, 0.35, 0.45], inquiries_6m: [0, 1, 3], age: [25, 35, 50, 65], tenure_months_with_bank: [6, 24, 60]}
  pdo: 20
  base_score: 600
  base_odds: 50
  min_iv: 0.02
output: {folder: "outputs/{recipe}/{date}_finance_scorecard"}
