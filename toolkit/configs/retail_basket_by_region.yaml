# L3.5: does basket value differ by region? Lines are aggregated to baskets first (the unit of analysis).
recipe: rcp_multi_group_test
dataset: {name: northstar_transactions, path: data/retail/transactions.parquet}
columns: {group: region, target: revenue, unit: basket_id}
filters:
  - "return_flag == False"
  - "quantity > 0"
  - "unit_price / list_price < 20"
params: {drop_duplicates: [line_id], aggregate_fn: sum, alpha: 0.05, posthoc: true}
output: {folder: "outputs/{recipe}/{date}_retail_basket_by_region"}
